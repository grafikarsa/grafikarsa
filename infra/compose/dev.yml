services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9.1-alpine
    command: valkey-server --requirepass ${VALKEY_PASSWORD} --appendonly yes
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    ports:
      - "127.0.0.1:${VALKEY_PORT}:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a ${VALKEY_PASSWORD} --no-auth-warning ping | grep PONG"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: /data
    ports:
      - "127.0.0.1:${RUSTFS_PORT}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT}:9001"
    volumes:
      - rustfsdata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health"]
      interval: 5s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
  valkeydata:
  rustfsdata:
