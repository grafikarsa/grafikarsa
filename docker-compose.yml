# ==============================================
# GRAFIKARSA v2 — DEVELOPMENT
# ==============================================
# Usage: make dev   (baca .env root)
#
# Web jalan NATIVE (pnpm dev) untuk HMR cepat, bukan container.
# API jalan di container (Air hot-reload) agar parity env S3/DB.
#
# URLs:
#   API      http://localhost:8080/health
#   Web      http://localhost:3000  (make dev-web, terminal terpisah)
#   Storage  http://localhost:9000  (S3 API) / :9001 (console)
#   DB       localhost:5432
#   Cache    localhost:6379

services:
  db:
    image: postgres:16-alpine
    container_name: grafikarsa-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5439}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - grafikarsa-network

  dragonfly:
    image: ghcr.io/dragonflydb/dragonfly:latest
    container_name: grafikarsa-dragonfly-dev
    restart: unless-stopped
    # snapshot_cron: simpan snapshot cache tiap 5 menit. Tanpa ini snapshot
    # hanya terjadi saat shutdown, jadi crash = semua counter rate-limit,
    # blacklist JTI, dan agregat view counter hilang sekaligus.
    #
    # PENTING: nilai cron harus tetap SATU argumen. Bentuk string (>) memecah
    # "--snapshot_cron=*/5 * * * *" menjadi beberapa argv, sehingga flag-nya
    # hanya menerima "*/5" dan dragonfly menolak start:
    #   ERROR: Illegal value '*/5' specified for flag 'snapshot_cron'
    # Kalau dragonfly gagal start, `api` (depends_on: service_healthy) ikut
    # tidak start — `make dev` gagal total.
    #
    # Formatnya crontab 5 field (menit jam hari bulan hari-dalam-minggu).
    # Catatan: pesan error dragonfly menyebut "six fields", padahal 6 field
    # justru yang DITOLAK — sudah diuji langsung ke binary-nya.
    command:
      - --maxmemory=256mb
      - --proactor_threads=1
      - --cache_mode
      - --dir=/data
      - --dbfilename=dump
      - "--snapshot_cron=*/5 * * * *"
    ports:
      - "${DRAGONFLY_PORT:-6390}:6379"
    volumes:
      - dragonfly_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - grafikarsa-network

  # S3-compatible storage. Default: RustFS self-host.
  # Ganti vendor = ganti image + S3_* env, tanpa ubah kode API.
  storage:
    image: rustfs/rustfs:latest
    container_name: grafikarsa-storage-dev
    restart: unless-stopped
    environment:
      # Vendor container membaca RUSTFS_*; aplikasi (api/worker) TIDAK pernah
      # membaca RUSTFS_*, hanya S3_* sehingga ganti vendor = ganti service ini.
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - storage_data:/data
    command: ["/data"]
    ports:
      - "${S3_PORT:-9020}:9000"
      - "${S3_CONSOLE_PORT:-9021}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - grafikarsa-network

  api:
    build:
      context: ./apps/api
      target: development
    container_name: grafikarsa-api-dev
    restart: unless-stopped
    env_file: .env
    environment:
      - APP_ENV=development
      - DB_HOST=db
      - DB_PORT=5432
      - DRAGONFLY_HOST=dragonfly
      - DRAGONFLY_PORT=6379
      - S3_ENDPOINT=http://storage:9000
      - INTERNAL_API_URL=http://api:8080/v1
      # Backup manual (permission system.backup) menulis ke volume persisten.
      - BACKUP_DIR=/var/backups/grafikarsa
    ports:
      - "${API_PORT:-8091}:8080"
    volumes:
      - ./apps/api:/app
      - /app/tmp
      - backup_data:/var/backups/grafikarsa
    depends_on:
      db:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      storage:
        condition: service_healthy
    networks:
      - grafikarsa-network

  # Worker: scheduler job berkala (outbox 30 dtk, stats 5 mnt, leaderboard
  # harian 02:05 WIB, promotion draft harian, cleanup, retention).
  # Fase 3: satu proses scheduler, tanpa port host.
  worker:
    build:
      context: ./apps/api
      target: development
    container_name: grafikarsa-worker-dev
    restart: unless-stopped
    env_file: .env
    environment:
      - APP_ENV=development
      - DB_HOST=db
      - DB_PORT=5432
      - DRAGONFLY_HOST=dragonfly
      - DRAGONFLY_PORT=6379
      - S3_ENDPOINT=http://storage:9000
    command: ["go", "run", "./cmd/worker", "serve"]
    volumes:
      - ./apps/api:/app
    depends_on:
      db:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      storage:
        condition: service_healthy
    networks:
      - grafikarsa-network

volumes:
  backup_data:
  postgres_data:
  dragonfly_data:
  storage_data:

networks:
  grafikarsa-network:
    driver: bridge
