# ==============================================
# GRAFIKARSA v2 — DEVELOPMENT
# ==============================================
# Usage: make dev   (baca .env root)
#
# Web jalan NATIVE (pnpm dev) untuk HMR cepat, bukan container.
# API jalan di container (Air hot-reload) agar parity env S3/DB.
#
# URLs:
#   API      http://localhost:8080/health
#   Web      http://localhost:3000  (make dev-web, terminal terpisah)
#   Storage  http://localhost:9000  (S3 API) / :9001 (console)
#   DB       localhost:5432
#   Cache    localhost:6379

services:
  db:
    image: postgres:16-alpine
    container_name: grafikarsa-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5439}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - grafikarsa-network

  dragonfly:
    image: ghcr.io/dragonflydb/dragonfly:latest
    container_name: grafikarsa-dragonfly-dev
    restart: unless-stopped
    command: >-
      --maxmemory=256mb --proactor_threads=1
      --cache_mode
      --dir=/data
      --dbfilename=dump
    ports:
      - "${DRAGONFLY_PORT:-6390}:6379"
    volumes:
      - dragonfly_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - grafikarsa-network

  # S3-compatible storage. Default: RustFS self-host.
  # Ganti vendor = ganti image + S3_* env, tanpa ubah kode API.
  storage:
    image: rustfs/rustfs:latest
    container_name: grafikarsa-storage-dev
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - storage_data:/data
    command: ["/data"]
    ports:
      - "${S3_PORT:-9020}:9000"
      - "${S3_CONSOLE_PORT:-9021}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - grafikarsa-network

  api:
    build:
      context: ./apps/api
      target: development
    container_name: grafikarsa-api-dev
    restart: unless-stopped
    env_file: .env
    environment:
      - APP_ENV=development
      - DB_HOST=db
      - DB_PORT=5432
      - DRAGONFLY_HOST=dragonfly
      - DRAGONFLY_PORT=6379
      - S3_ENDPOINT=http://storage:9000
      - INTERNAL_API_URL=http://api:8080/v1
    ports:
      - "${API_PORT:-8091}:8080"
    volumes:
      - ./apps/api:/app
      - /app/tmp
    depends_on:
      db:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      storage:
        condition: service_healthy
    networks:
      - grafikarsa-network

volumes:
  postgres_data:
  dragonfly_data:
  storage_data:

networks:
  grafikarsa-network:
    driver: bridge
