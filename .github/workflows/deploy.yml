name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/grafikarsa-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/grafikarsa-backend:${{ github.sha }}
          target: production
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/grafikarsa-backend:latest
          cache-to: type=inline
      
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/grafikarsa-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/grafikarsa-web:${{ github.sha }}
          target: production
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_STORAGE_URL=${{ secrets.NEXT_PUBLIC_STORAGE_URL }}
            NEXT_PUBLIC_MAINTENANCE_MODE=${{ secrets.NEXT_PUBLIC_MAINTENANCE_MODE }}
            NEXT_PUBLIC_AI_FEATURES_ENABLED=${{ secrets.NEXT_PUBLIC_AI_FEATURES_ENABLED }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/grafikarsa-web:latest
          cache-to: type=inline
      
      - name: Prepare server directories
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Ensure the deploy directory exists
            mkdir -p /opt/grafikarsa
            
            # Automated Cleanup: Use Docker to handle root-owned files (avoiding sudo)
            # This works because the deploy user has permission to run Docker
            docker run --rm -v /opt/grafikarsa:/app busybox sh -c "rm -f /app/docker-compose.deploy.yml && rm -rf /app/db"
            
            # Reset ownership to ensure scp-action can write new files
            docker run --rm -v /opt:/mnt busybox chown -R $(id -u):$(id -g) /mnt/grafikarsa

      - name: Copy config files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "docker-compose.deploy.yml,db/"
          target: "/opt/grafikarsa"
      
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /opt/grafikarsa
            echo "Starting deployment of version ${{ github.sha }}..."
            
            # Export variables for docker-compose
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            export IMAGE_TAG=${{ github.sha }}
            
            # Pull specific version and update
            docker compose -f docker-compose.deploy.yml pull
            docker compose -f docker-compose.deploy.yml up -d
            
            # Cleanup old images
            docker image prune -f
            
            # Basic Health Check
            echo "Checking health..."
            sleep 15
            if curl -s --fail http://localhost:8080/api/v1/health > /dev/null; then
              echo "✅ Backend is UP"
            else
              echo "❌ Backend HEALTH CHECK FAILED!"
              exit 1
            fi
            
            echo "✅ Deployment version ${{ github.sha }} complete!"
      
      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
          fi
