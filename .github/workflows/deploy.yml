name: deploy
on:
  # Deploy ke produksi TIDAK lagi otomatis tiap push ke main.
  #
  # Grafikarsa masih menjalankan stack v1 di server, dan go-live v2 punya
  # prasyarat yang belum dipenuhi: storage mirror 5,1 GB, migrasi DB v1→v2
  # di server, jendela maintenance, dan restore drill. Kalau push ke main
  # otomatis men-deploy, satu merge bisa mengganti situs produksi dengan stack
  # v2 yang datanya belum dimigrasi -> situsnya kosong.
  #
  # Deploy sekarang jadi tindakan yang disengaja: tag versi (v2.0.0) atau
  # manual lewat workflow_dispatch. Itu juga cocok dengan prosedur go-live
  # PRD §16: jendela maintenance, backup, migrasi, verifikasi.
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: docker.io

jobs:
  derive-urls:
    runs-on: ubuntu-latest
    outputs:
      scheme: ${{ steps.d.outputs.scheme }}
      app_url: ${{ steps.d.outputs.app_url }}
      api_url: ${{ steps.d.outputs.api_url }}
    steps:
      - id: d
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          if [[ "$DOMAIN" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then SCHEME=http; else SCHEME=https; fi
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "app_url=$SCHEME://$DOMAIN" >> "$GITHUB_OUTPUT"
          echo "api_url=$SCHEME://$DOMAIN/api/v1" >> "$GITHUB_OUTPUT"

  build-push:
    needs: derive-urls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push api + worker
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          target: production
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/grafikarsa-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/grafikarsa-api:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          push: true
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ needs.derive-urls.outputs.app_url }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.TURNSTILE_SITE_KEY }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/grafikarsa-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/grafikarsa-web:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (blocking on HIGH/CRITICAL fixable)
        # v0.28.0 rusak: composite action-nya mereferensikan
        # aquasecurity/setup-trivy@v0.2.1, dan tag itu sudah dihapus dari
        # upstream -> workflow gagal saat "Prepare all required actions" dengan
        # "unable to find version 'v0.2.1'". Versi yang lebih baru mengunci
        # setup-trivy by commit SHA, jadi selalu bisa di-resolve.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/grafikarsa-api:sha-${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  deploy:
    needs: [derive-urls, build-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Copy deploy files
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p /opt/grafikarsa && chmod 700 /opt/grafikarsa"
          # tools/gk-backup.sh (bukan tools/backup.sh) karena crontab server
          # memanggil path itu: 0 2 * * * /opt/grafikarsa/gk-backup.sh
          # Kalau nama filenya berbeda, cron diam-diam tetap menjalankan
          # script lama — backup harian berhenti tanpa error yang terlihat.
          scp -P "${{ secrets.SSH_PORT }}" docker-compose.deploy.yml Caddyfile \
            tools/gk-backup.sh tools/verify-backup.sh \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/grafikarsa/"
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "chmod 700 /opt/grafikarsa/gk-backup.sh /opt/grafikarsa/verify-backup.sh"
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p /opt/grafikarsa/infra/postgres/init"
          scp -P "${{ secrets.SSH_PORT }}" -r infra/postgres/init/. \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/grafikarsa/infra/postgres/init/"
      - name: Backup + migrate + deploy (dengan rollback)
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/grafikarsa
          DC="docker compose -f docker-compose.deploy.yml"
          PREV_TAG=$(grep -E '^IMAGE_TAG=' .env | cut -d= -f2 || echo latest)
          NEW_TAG="sha-${{ github.sha }}"

          # 1. Backup sebelum menyentuh apa pun (DB + storage listing).
          mkdir -p backup
          if $DC ps --status running db >/dev/null 2>&1; then
            $DC exec -T db pg_dump -Fc -U "${DB_USER:-grafikarsa}" "${DB_NAME:-grafikarsa}" \
              > "backup/pre-deploy-$(date +%F-%H%M).dump" || echo "WARN: backup gagal, lanjut"
          fi

          # 2. Pin tag image di .env (file yang benar-benar dibaca compose).
          if grep -qE '^IMAGE_TAG=' .env; then
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$NEW_TAG|" .env
          else
            echo "IMAGE_TAG=$NEW_TAG" >> .env
          fi
          $DC pull || { echo "FAIL: pull"; exit 1; }

          # 3. Migrasi goose (one-off container, idempoten).
          #
          # Versi skema SEBELUM migrasi dicatat dulu: kalau image baru nanti
          # gagal, skemanya juga harus dikembalikan — mengembalikan image saja
          # tidak cukup kalau migrasi barunya tidak backward-compatible.
          # Ambil versi skema dari baris "db version: N" secara spesifik.
          # Dulu dipakai `tr -dc '0-9'` (semua angka di output) — rapuh:
          # satu baris log bertimestamp atau nomor request akan ikut
          # terambil dan PREV_SCHEMA jadi sampah, sehingga rollback skema
          # gagal diam-diam (hanya "WARN").
          PREV_SCHEMA=$($DC run --rm --entrypoint /migrate api version 2>/dev/null \
            | sed -n 's/^db version: *\([0-9][0-9]*\).*/\1/p' | head -n 1)
          if [ -z "${PREV_SCHEMA:-}" ]; then
            # Kemungkinan image baru sendiri yang rusak (bukan cuma
            # aplikasinya) — lalu versi skema tak bisa dibaca dari image itu.
            # Rolls back skema otomatis jadi tidak mungkin; jaring pengaman
            # terakhirnya restore dari backup pre-deploy (lihat langkah 6).
            echo "PERINGATAN: versi skema pra-deploy tidak terbaca; rollback skema otomatis TIDAK bisa dilakukan."
            echo "  Kalau deploy gagal, restore manual dari backup pre-deploy (lihat langkah 6)."
          else
            echo "Versi skema sebelum deploy: $PREV_SCHEMA"
          fi
          $DC run --rm --entrypoint /migrate api up || { echo "FAIL: migrate"; exit 1; }

          # 3b. Migrasi baru saja mengubah skema sementara image LAMA masih
          # berjalan. Kalau migrasi tidak backward-compatible, aplikasi yang
          # sedang hidup bisa rusak. Periksa SEBELUM mengganti image, supaya
          # tidak perlu menyentuh image baru sama sekali.
          still_ok=0
          for i in $(seq 1 10); do
            if $DC exec -T api /api -healthcheck >/dev/null 2>&1; then still_ok=1; break; fi
            sleep 3
          done
          if [ "$still_ok" != "1" ]; then
            echo "FAIL: aplikasi yang sedang berjalan rusak setelah migrasi; kembalikan skema"
            if [ -n "${PREV_SCHEMA:-}" ] && [ "$PREV_SCHEMA" != "0" ]; then
              $DC run --rm --entrypoint /migrate api down-to "$PREV_SCHEMA" || echo "WARN: rollback skema gagal"
            fi
            exit 1
          fi

          # 4. Naikkan service.
          $DC up -d || { echo "FAIL: up"; exit 1; }

          # 5. Healthcheck 30x10s.
          ok=0
          for i in $(seq 1 30); do
            if $DC exec -T api /api -healthcheck >/dev/null 2>&1; then ok=1; break; fi
            sleep 10
          done

          # 6. Rollback bila gagal: image DAN skema.
          if [ "$ok" != "1" ]; then
            echo "FAIL: healthcheck; rollback ke $PREV_TAG"
            # Skema dulu, baru image: image LAMA dijalankan dengan skema LAMA.
            # Kalau dibalik, image lama akan berjalan dengan skema baru — itu
            # justru penyebab rollback tidak berhasil.
            if [ -n "${PREV_SCHEMA:-}" ] && [ "$PREV_SCHEMA" != "0" ]; then
              echo "Kembalikan skema ke versi $PREV_SCHEMA"
              $DC run --rm --entrypoint /migrate api down-to "$PREV_SCHEMA" || echo "WARN: rollback skema gagal"
            else
              echo "PERINGATAN: versi skema pra-deploy tidak diketahui, skema TIDAK dikembalikan."
              echo "  Restore manual dari backup pre-deploy:"
              echo "    ls -t backup/pre-deploy-*.dump | head -1"
              echo "    $DC exec -T db pg_restore -U \"\${DB_USER:-grafikarsa}\" -d \"\${DB_NAME:-grafikarsa}\" --clean --if-exists < \$(ls -t backup/pre-deploy-*.dump | head -1)"
            fi
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$PREV_TAG|" .env
            $DC up -d
            # Verifikasi skema setelah rollback: harus kembali ke versi pra-deploy.
            if [ -n "${PREV_SCHEMA:-}" ] && [ "$PREV_SCHEMA" != "0" ]; then
              echo "Cek skema setelah rollback:"; $DC run --rm --entrypoint /migrate api version || true
            fi
            exit 1
          fi

          # 6b. Seed idempoten (admin awal + role + permission) di server baru.
          $DC run --rm --entrypoint /seed api || echo "WARN: seed gagal/dilewati"

          # 7. Bersihkan image lama hanya bila deploy hijau.
          docker image prune -f --filter "until=168h" >/dev/null 2>&1 || true
          echo "DEPLOY OK"
          REMOTE
