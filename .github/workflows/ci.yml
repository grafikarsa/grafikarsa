name: ci
on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/api/go.sum
      - name: gofmt (gate)
        working-directory: apps/api
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "File tidak terformat:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        working-directory: apps/api
        run: go vet ./...
      - name: go test (race)
        working-directory: apps/api
        run: go test -race ./...
      - name: go build
        working-directory: apps/api
        run: go build ./...
      - name: OpenAPI contract tidak stale
        working-directory: apps/api
        run: |
          go run ./cmd/tools/gen-openapi > /tmp/openapi.gen.yaml
          if ! diff -q ../../packages/contracts/openapi.yaml /tmp/openapi.gen.yaml >/dev/null; then
            echo "FATAL: packages/contracts/openapi.yaml tidak sinkron dengan routes.go."
            echo "Jalankan: make openapi"
            diff -u ../../packages/contracts/openapi.yaml /tmp/openapi.gen.yaml | head -40
            exit 1
          fi
          echo "openapi: sinkron"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm exec tsc --noEmit
        working-directory: apps/web
      - run: pnpm exec eslint .
        working-directory: apps/web
      - run: pnpm build
        working-directory: apps/web

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validasi compose + env example
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.prod.yml config >/dev/null
          docker compose -f docker-compose.deploy.yml config >/dev/null
          echo "compose OK"
