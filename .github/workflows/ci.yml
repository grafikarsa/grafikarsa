name: ci
on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/api/go.sum
      - name: gofmt (gate)
        working-directory: apps/api
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "File tidak terformat:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        working-directory: apps/api
        run: go vet ./...
      - name: go test (race)
        working-directory: apps/api
        run: go test -race ./...
      - name: go build
        working-directory: apps/api
        run: go build ./...
      - name: OpenAPI contract tidak stale
        working-directory: apps/api
        run: |
          go run ./cmd/tools/gen-openapi > /tmp/openapi.gen.yaml
          if ! diff -q ../../packages/contracts/openapi.yaml /tmp/openapi.gen.yaml >/dev/null; then
            echo "FATAL: packages/contracts/openapi.yaml tidak sinkron dengan routes.go."
            echo "Jalankan: make openapi"
            diff -u ../../packages/contracts/openapi.yaml /tmp/openapi.gen.yaml | head -40
            exit 1
          fi
          echo "openapi: sinkron"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # Tidak ada package.json di root repo, jadi pnpm/action-setup tidak
          # bisa membaca field "packageManager". Versi dictate eksplisit (pnpm
          # 10, sama dengan apps/web/Dockerfile).
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm exec tsc --noEmit
        working-directory: apps/web
      - run: pnpm exec eslint .
        working-directory: apps/web
      - name: Tipe kontrak FE tidak stale
        working-directory: apps/web
        run: |
          pnpm exec openapi-typescript ../../packages/contracts/openapi.yaml -o /tmp/api-types.gen.ts >/dev/null
          if ! diff -q lib/api-types.ts /tmp/api-types.gen.ts >/dev/null; then
            echo "FATAL: lib/api-types.ts tidak sinkron dengan kontrak. Jalankan: make types-web"
            exit 1
          fi
      - run: pnpm test
        working-directory: apps/web
      - run: pnpm build
        working-directory: apps/web

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action@v2 mewajibkan GITLEAKS_LICENSE untuk repositori
      # organisasi, jadi binary resmi dipasang langsung (tanpa license).
      # Allowlist sempit ada di .gitleaks.toml.
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: gitleaks
        run: gitleaks detect --source . --redact --verbose --exit-code 1
      # Self-test: buktikan bahwa scan di atas benar-benar aktif.
      #
      # Tanpa langkah ini, konfigurasi gitleaks yang salah (mis. [[allowlists]]
      # tanpa [extend] useDefault, sehingga tidak ada rules yang aktif) akan
      # selalu melaporkan "no leaks found" dan job tetap hijau — persis yang
      # pernah terjadi. Self-test menyisipkan secret palsu ke repo sementara
      # memakai .gitleaks.toml yang SAMA dengan yang dipakai scan utama, lalu
      # mewajibkan gitleaks MENEMUKAN secret itu.
      - name: gitleaks self-test (pastikan rules aktif)
        run: |
          set -euo pipefail
          T=$(mktemp -d)
          cp "$GITHUB_WORKSPACE/.gitleaks.toml" "$T/.gitleaks.toml"
          cd "$T"
          git init -q .
          # Secret di-generate saat runtime. Kalau literal-nya ditulis di file
          # ini, gitleaks akan menandainya sebagai temuan (self-referential) dan
          # repo sendiri tidak akan pernah bisa hijau.
          #
          # PENTING: jangan pakai `head -c N` di ujung pipeline — head menutup
          # pipe duluan, producer-nya dapat SIGPIPE dan hasilnya bisa kosong.
          # Nilai kosong TIDAK dipindai gitleaks, jadi self-test akan gagal
          # secara acak. Karena itu pipe-nya ditutup di ujung (tr), bukan di head,
          # dan panjang secret-nya diverifikasi sebelum dipakai.
          if command -v openssl >/dev/null 2>&1; then
            SECRET="$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9')"
          else
            SECRET="$(cat /dev/urandom | base64 | tr -dc 'A-Za-z0-9')"
          fi
          if [ "${#SECRET}" -lt 32 ]; then
            echo "FATAL: gagal membuat secret self-test (panjang=${#SECRET})"
            exit 1
          fi
          printf 'api_key = "%s"\n' "$SECRET" > planted-secret.txt
          # Pastikan secret benar-benar tertulis sebelum dipindai.
          grep -qF "$SECRET" planted-secret.txt || {
            echo "FATAL: secret self-test tidak tertulis ke file"; exit 1; }
          git add -A
          git -c user.email=ci@local -c user.name=ci commit -qm "self-test"
          if gitleaks detect --source . --no-banner --redact >/dev/null 2>&1; then
            echo "FATAL: gitleaks TIDAK menemukan secret yang disisipkan."
            echo "       Rules kemungkinan tidak aktif — cek [extend] useDefault di .gitleaks.toml"
            exit 1
          fi
          echo "gitleaks self-test OK: rules aktif dan secret terdeteksi"

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validasi compose + env example
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.prod.yml config >/dev/null
          docker compose -f docker-compose.deploy.yml config >/dev/null
          echo "compose OK"
