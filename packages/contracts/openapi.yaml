openapi: 3.0.3
info:
  title: Grafikarsa API
  version: 0.1.0
  description: |
    Kontrak API Grafikarsa. Berkas ini adalah sumber kebenaran (source of truth)
    untuk seluruh endpoint, skema permintaan, dan skema respons. Kode server Go
    dan klien TypeScript di-generate dari spesifikasi ini.
servers:
  - url: /api/v1
paths:
  /ping:
    get:
      operationId: getPing
      tags:
        - system
      summary: Cek API hidup
      responses:
        "200":
          description: API hidup dan siap menerima permintaan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pong"
        default:
          $ref: "#/components/responses/Problem"
components:
  schemas:
    Pong:
      type: object
      required:
        - pong
      properties:
        pong:
          type: boolean
    FieldError:
      type: object
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
        ref:
          type: string
        code:
          type: string
        message:
          type: string
    Problem:
      type: object
      description: |
        Respons error sesuai RFC 9457 (Problem Details for HTTP APIs).
        Dikirim dengan media type application/problem+json.
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        requestId:
          type: string
  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
