          description: Cursor halaman berikutnya. Kosong pada halaman terakhir.
    AdminUserCreate:
      type: object
      description: Data pembuatan akun oleh admin.
      required: [accountType, displayName]
      properties:
        accountType:
          $ref: "#/components/schemas/AccountType"
        displayName:
          type: string
          description: Nama tampilan, 1–100 karakter.
        nisn:
          type: string
          description: NISN 10 digit. Wajib untuk siswa.
        staffNumber:
          type: string
          description: NIP/ID staf, 3–30 karakter.
        classId:
          type: string
          format: uuid
          description: Kelas siswa. Wajib untuk siswa.
        entryYear:
          type: integer
          description: Angkatan masuk, 1950–2100. Default dihitung dari kelas.
        teacherMajorIds:
          type: array
          description: Jurusan yang diampu. Hanya untuk guru.
          items:
            type: string
            format: uuid
    AdminUserCreated:
      type: object
      required: [user, initialPassword]
      properties:
        user:
          $ref: "#/components/schemas/AdminUserDetail"
