            Sandi awal akun. Hanya ditampilkan sekali pada respons ini dan tidak
            dapat diambil kembali.
    AdminUserUpdate:
      type: object
      description: Perubahan data akun oleh admin. Field yang tidak dikirim tidak berubah.
      properties:
        displayName:
          type: string
          description: Nama tampilan, 1–100 karakter.
        nisn:
          type: string
          description: NISN 10 digit. Kirim string kosong untuk mengosongkan.
        staffNumber:
          type: string
          description: NIP/ID staf, 3–30 karakter. Kirim string kosong untuk mengosongkan.
        accountType:
          $ref: "#/components/schemas/AccountType"
        teacherMajorIds:
          type: array
          description: Jurusan yang diampu. Hanya untuk guru.
          items:
            type: string
            format: uuid
    AdminContentBlockRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: Alasan pencabutan izin, 3–300 karakter.
    IssuedPassword:
      type: object
      description: Sandi yang baru diterbitkan. Hanya ditampilkan sekali.
      required: [password, expiresAt]
      properties:
        password:
          type: string
          description: Sandi baru. Hanya ditampilkan sekali pada respons ini dan tidak dapat diambil kembali.
        expiresAt:
          type: string
          format: date-time
          description: Waktu kedaluwarsa sandi.
    ImportKind:
      type: string
      enum: [students, teachers, staff]
      description: Jenis data yang diimpor.
    ImportStatus:
      type: string
      enum: [validating, ready, invalid, committing, committed, failed, cancelled]
      description: Status pekerjaan impor.
    ImportRowError:
      type: object
      description: Satu kesalahan validasi pada satu baris CSV.
      required: [row, field, message]
      properties:
        row:
          type: integer
          description: Nomor baris data (mulai 1). Baris 0 berarti kesalahan seluruh berkas.
        field:
          type: string
          description: Nama kolom yang bermasalah.
        message:
          type: string
          description: Pesan kesalahan dalam bahasa Indonesia.
    ImportSkippedRow:
      type: object
      description: Satu baris yang dilewati saat impor dijalankan.
      required: [row, reason]
      properties:
        row:
          type: integer
          description: Nomor baris data (mulai 1).
        reason:
          type: string
          description: Alasan baris dilewati.
    ImportJob:
      type: object
      description: Pekerjaan impor CSV beserta hasil validasi dan eksekusinya.
      required:
        - id
        - kind
        - status
        - totalRows
        - validRows
        - errorCountTotal
        - errors
        - byClass
        - created
        - skipped
        - createdAt
        - committedAt
        - createdBy
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ImportKind"
        status:
          $ref: "#/components/schemas/ImportStatus"
        totalRows:
          type: integer
          nullable: true
          description: Jumlah baris data pada berkas.
        validRows:
          type: integer
          nullable: true
          description: Jumlah baris yang lolos validasi.
        errorCountTotal:
          type: integer
          description: Jumlah seluruh kesalahan (daftar `errors` dapat dipotong).
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ImportRowError"
        byClass:
          type: object
          additionalProperties:
            type: integer
          description: Jumlah baris valid per kelas (khusus siswa).
        created:
          type: integer
          nullable: true
          description: Jumlah akun yang dibuat atau sudah ada saat impor selesai.
        skipped:
          type: array
          items:
            $ref: "#/components/schemas/ImportSkippedRow"
        createdAt:
          type: string
          format: date-time
        committedAt:
          type: string
          format: date-time
          nullable: true
        createdBy:
          type: string
          format: uuid
    ImportJobList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ImportJob"
    Pong:
      type: object
      required:
        - pong
      properties:
        pong:
          type: boolean
    FieldError:
      type: object
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
        ref:
          type: string
        code:
          type: string
        message:
          type: string
    Problem:
      type: object
      description: |
        Respons error sesuai RFC 9457 (Problem Details for HTTP APIs).
        Dikirim dengan media type application/problem+json.
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        requestId:
          type: string
  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
