openapi: 3.0.3
info:
  title: Grafikarsa API
  version: 0.1.0
  description: |
    Kontrak API Grafikarsa. Berkas ini adalah sumber kebenaran (source of truth)
    untuk seluruh endpoint, skema permintaan, dan skema respons. Kode server Go
    dan klien TypeScript di-generate dari spesifikasi ini.
servers:
  - url: /api/v1
paths:
  /ping:
    get:
      operationId: getPing
      tags:
        - system
      summary: Cek API hidup
      responses:
        "200":
          description: API hidup dan siap menerima permintaan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pong"
        default:
          $ref: "#/components/responses/Problem"
  /auth/csrf:
    get:
      operationId: getAuthCsrf
      tags: [auth]
      summary: Ambil token CSRF
      description: |
        Mengatur cookie `__Host-gk_csrf` dan mengembalikan nilainya. Klien wajib
        mengirim nilai ini di header `X-CSRF-Token` untuk setiap request yang mengubah data.
      responses:
        "200":
          description: Token CSRF.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfToken"
        default:
          $ref: "#/components/responses/Problem"
  /auth/login:
    post:
      operationId: postAuthLogin
      tags: [auth]
      summary: Masuk dengan NISN/NIP/username dan sandi
      description: |
        Berhasil → cookie sesi `__Host-gk_session` diatur dan cookie CSRF diputar.
        `nextStep` memberi tahu klien halaman wajib berikutnya.
        Gagal → 401 `INVALID_CREDENTIALS` (pesan sama untuk identitas tidak ada dan sandi salah).
        Terlalu banyak percobaan → 429 `RATE_LIMITED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Berhasil masuk.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"
  /auth/logout:
    post:
      operationId: postAuthLogout
      tags: [auth]
      summary: Keluar (cabut sesi ini)
      responses:
        "204":
          description: Sesi dicabut dan cookie dihapus.
        default:
          $ref: "#/components/responses/Problem"
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Sesi saat ini
      description: Mengembalikan sesi aktif. Tanpa sesi → 401 `UNAUTHENTICATED`.
      responses:
        "200":
          description: Sesi aktif.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"
  /auth/username-availability:
    get:
      operationId: getAuthUsernameAvailability
      tags: [auth]
      summary: Cek ketersediaan username
      description: Butuh sesi (boleh belum aktivasi).
      parameters:
        - name: u
          in: query
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: Hasil pengecekan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsernameAvailability"
        default:
          $ref: "#/components/responses/Problem"
  /auth/activate:
    post:
      operationId: postAuthActivate
      tags: [auth]
      summary: Aktivasi akun (login pertama)
      description: |
        Hanya untuk sesi dengan `nextStep = activate`. Mengatur username dan sandi baru,
        lalu mengembalikan recovery code (hanya ditampilkan sekali). Aktivasi baru selesai
        setelah `POST /auth/recovery-codes/confirm`.
        Akun hasil migrasi v1 yang sudah punya username dan sandi boleh mengirim
        `newPassword` kosong untuk mempertahankan sandinya.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateRequest"
      responses:
        "200":
          description: Recovery code baru.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        default:
          $ref: "#/components/responses/Problem"
  /auth/recovery-codes/confirm:
    post:
      operationId: postAuthRecoveryCodesConfirm
      tags: [auth]
      summary: Konfirmasi recovery code sudah disimpan
      responses:
        "200":
          description: Aktivasi selesai, sesi diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"
  /auth/recovery-codes/regenerate:
    post:
      operationId: postAuthRecoveryCodesRegenerate
      tags: [auth]
      summary: Buat ulang recovery code
      description: Butuh sandi saat ini. Semua kode lama hangus.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirmation"
      responses:
        "200":
          description: Recovery code baru.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        default:
          $ref: "#/components/responses/Problem"
  /auth/password/recover:
    post:
      operationId: postAuthPasswordRecover
      tags: [auth]
      summary: Reset sandi dengan recovery code
      description: Tanpa sesi. Berhasil → semua sesi user dicabut, user harus masuk ulang.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoverPasswordRequest"
      responses:
        "204":
          description: Sandi diganti.
        default:
          $ref: "#/components/responses/Problem"
  /auth/password/change:
    post:
      operationId: postAuthPasswordChange
      tags: [auth]
      summary: Ganti sandi
      description: |
        `currentPassword` wajib kecuali sesi sedang `nextStep = change_password`
        (login dengan sandi sementara). Berhasil → sesi lain dicabut.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Sandi diganti, sesi saat ini diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"
  /auth/sessions:
    get:
      operationId: getAuthSessions
      tags: [auth]
      summary: Daftar sesi aktif milik user
      responses:
        "200":
          description: Sesi aktif.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDeviceList"
        default:
          $ref: "#/components/responses/Problem"
  /auth/sessions/{id}:
    delete:
      operationId: deleteAuthSession
      tags: [auth]
      summary: Cabut satu sesi milik user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Sesi dicabut.
        default:
          $ref: "#/components/responses/Problem"
  /auth/sessions/revoke-others:
    post:
      operationId: postAuthSessionsRevokeOthers
      tags: [auth]
      summary: Keluar dari semua perangkat lain
      responses:
        "204":
          description: Sesi lain dicabut.
        default:
          $ref: "#/components/responses/Problem"
  /majors:
    get:
      operationId: getMajors
      tags: [academic]
      summary: Daftar jurusan aktif
      description: Publik. Hanya mengembalikan jurusan yang aktif beserta grup cerminnya.
      responses:
        "200":
          description: Daftar jurusan aktif.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MajorList"
        default:
          $ref: "#/components/responses/Problem"
  /admin/majors:
    get:
      operationId: getAdminMajors
      tags: [admin-academic]
      summary: Daftar seluruh jurusan
      description: |
        Butuh izin `academic.manage_majors`, `academic.manage_years`,
        `academic.manage_classes`, atau `user.view`. Tanpa izin → 404.
        Termasuk jurusan yang sudah tidak aktif.
      responses:
        "200":
          description: Daftar seluruh jurusan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MajorList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: postAdminMajor
      tags: [admin-academic]
      summary: Buat jurusan
      description: |
        Membuat jurusan sekaligus grup cerminnya. Butuh izin `academic.manage_majors`.
        Tanpa izin → 404. Kode jurusan duplikat → 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MajorCreate"
      responses:
        "201":
          description: Jurusan dibuat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Major"
        default:
          $ref: "#/components/responses/Problem"
  /admin/majors/{id}:
    patch:
      operationId: patchAdminMajor
      tags: [admin-academic]
      summary: Ubah jurusan
      description: |
        Butuh izin `academic.manage_majors`. Tanpa izin → 404.
        Menonaktifkan jurusan memindahkan grupnya ke riwayat.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MajorUpdate"
      responses:
        "200":
          description: Jurusan diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Major"
        default:
          $ref: "#/components/responses/Problem"
  /admin/academic-years:
    get:
      operationId: getAdminAcademicYears
      tags: [admin-academic]
      summary: Daftar tahun ajaran
      description: |
        Butuh izin `academic.manage_majors`, `academic.manage_years`,
        `academic.manage_classes`, atau `user.view`. Tanpa izin → 404.
      responses:
        "200":
          description: Daftar tahun ajaran, terbaru lebih dulu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicYearList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: postAdminAcademicYear
      tags: [admin-academic]
      summary: Buat tahun ajaran
      description: |
        Butuh izin `academic.manage_years`. Tanpa izin → 404.
        Tahun ajaran duplikat → 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcademicYearCreate"
      responses:
        "201":
          description: Tahun ajaran dibuat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicYear"
        default:
          $ref: "#/components/responses/Problem"
  /admin/academic-years/{id}:
    patch:
      operationId: patchAdminAcademicYear
      tags: [admin-academic]
      summary: Ubah tanggal tahun ajaran
      description: |
        Butuh izin `academic.manage_years`. Tanpa izin → 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcademicYearUpdate"
      responses:
        "200":
          description: Tahun ajaran diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicYear"
        default:
          $ref: "#/components/responses/Problem"
  /admin/academic-years/{id}/set-current:
    post:
      operationId: postAdminAcademicYearSetCurrent
      tags: [admin-academic]
      summary: Tandai tahun ajaran sebagai tahun ajaran aktif
      description: |
        Butuh izin `academic.manage_years`. Tanpa izin → 404.
        Hanya satu tahun ajaran yang aktif dalam satu waktu.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Tahun ajaran aktif diperbarui.
        default:
          $ref: "#/components/responses/Problem"
  /admin/classes:
    get:
      operationId: getAdminClasses
      tags: [admin-academic]
      summary: Daftar kelas
      description: |
        Butuh izin `academic.manage_majors`, `academic.manage_years`,
        `academic.manage_classes`, atau `user.view`. Tanpa izin → 404.
      parameters:
        - name: academicYearId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: majorId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Daftar kelas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: postAdminClass
      tags: [admin-academic]
      summary: Buat kelas
      description: |
        Membuat kelas sekaligus grup cerminnya. Butuh izin `academic.manage_classes`
        pada jurusan terkait. Tanpa izin → 404. Kelas duplikat → 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassCreate"
      responses:
        "201":
          description: Kelas dibuat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
        default:
          $ref: "#/components/responses/Problem"
  /admin/classes/{id}:
    patch:
      operationId: patchAdminClass
      tags: [admin-academic]
      summary: Ubah rombel kelas
      description: |
        Butuh izin `academic.manage_classes` pada jurusan kelas terkait.
        Tanpa izin → 404. Kelas duplikat → 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassUpdate"
      responses:
        "200":
          description: Kelas diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteAdminClass
      tags: [admin-academic]
      summary: Hapus kelas
      description: |
        Butuh izin `academic.manage_classes` pada jurusan kelas terkait.
        Tanpa izin → 404. Kelas yang sudah punya siswa → 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Kelas dihapus.
        default:
          $ref: "#/components/responses/Problem"
  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin-users]
      summary: Daftar pengguna
      description: |
        Butuh izin `user.view`. Tanpa izin → 404. Admin jurusan hanya melihat
        pengguna pada jurusannya. Hasil terbaru lebih dulu dan berhalaman
        dengan `cursor`.
      parameters:
        - name: accountType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AccountType"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AccountStatus"
        - name: majorId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: classId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          required: false
          description: Cari pada nama tampilan, username, NISN, atau NIP/ID staf.
          schema:
            type: string
            maxLength: 100
        - name: cursor
          in: query
          required: false
          description: Cursor halaman berikutnya dari `nextCursor`.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Daftar pengguna.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: postAdminUser
      tags: [admin-users]
      summary: Buat pengguna
      description: |
        Butuh izin `user.create`. Admin jurusan hanya dapat membuat siswa pada
        jurusannya. NISN atau NIP/ID staf duplikat → 409.
        `initialPassword` hanya ditampilkan sekali pada respons ini dan tidak
        dapat diambil kembali.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserCreate"
      responses:
        "201":
          description: Pengguna dibuat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserCreated"
        default:
          $ref: "#/components/responses/Problem"
  /admin/users/{id}:
    get:
      operationId: getAdminUser
      tags: [admin-users]
      summary: Detail pengguna
      description: |
        Butuh izin `user.view`. Tanpa izin atau di luar jurusan admin → 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Detail pengguna.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchAdminUser
      tags: [admin-users]
      summary: Ubah pengguna
      description: |
        Butuh izin `user.update`. Tanpa izin atau di luar jurusan admin → 404.
        Field yang tidak dikirim tidak berubah. Mengirim NISN atau NIP/ID staf
        kosong akan mengosongkannya. NISN atau NIP/ID staf duplikat → 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Pengguna diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        default:
          $ref: "#/components/responses/Problem"
  /admin/users/{id}/deactivate:
    post:
      operationId: postAdminUserDeactivate
      tags: [admin-users]
      summary: Nonaktifkan pengguna
      description: |
        Butuh izin `user.deactivate`. Tanpa izin atau di luar jurusan admin → 404.
        Menonaktifkan akun mencabut seluruh sesinya.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Pengguna dinonaktifkan.
        default:
          $ref: "#/components/responses/Problem"
  /admin/users/{id}/reactivate:
    post:
      operationId: postAdminUserReactivate
      tags: [admin-users]
      summary: Aktifkan kembali pengguna
      description: |
        Butuh izin `user.deactivate`. Tanpa izin atau di luar jurusan admin → 404.
        Akun dengan tahun lulus kembali menjadi alumni.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Pengguna diaktifkan kembali.
        default:
          $ref: "#/components/responses/Problem"
  /admin/users/{id}/reset-password:
    post:
      operationId: postAdminUserResetPassword
      tags: [admin-users]
      summary: Reset sandi pengguna
      description: |
        Butuh izin `user.reset_password`. Tanpa izin atau di luar jurusan admin → 404.
        Hanya untuk akun yang sudah aktivasi; akun belum aktivasi memakai
        terbitkan ulang sandi awal. Seluruh sesi lama dicabut. `password` hanya
        ditampilkan sekali pada respons ini dan tidak dapat diambil kembali.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Sandi sementara diterbitkan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedPassword"
        default:
          $ref: "#/components/responses/Problem"
  /admin/users/{id}/reissue-initial-password:
    post:
      operationId: postAdminUserReissueInitialPassword
      tags: [admin-users]
      summary: Terbitkan ulang sandi awal
      description: |
        Butuh izin `user.reset_password`. Tanpa izin atau di luar jurusan admin → 404.
        Hanya untuk akun yang belum aktivasi; akun yang sudah aktivasi memakai
        reset sandi. `password` hanya ditampilkan sekali pada respons ini dan
        tidak dapat diambil kembali.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Sandi awal baru diterbitkan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedPassword"
        default:
          $ref: "#/components/responses/Problem"
  /admin/users/{id}/content-block:
    post:
      operationId: postAdminUserContentBlock
      tags: [admin-users]
      summary: Cabut izin membuat konten
      description: |
        Butuh izin `user.block_content` global. Tanpa izin → 404.
        Alasan wajib 3–300 karakter dan dicatat di audit log.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminContentBlockRequest"
      responses:
        "204":
          description: Izin membuat konten dicabut.
        default:
          $ref: "#/components/responses/Problem"
  /admin/users/{id}/content-unblock:
    post:
      operationId: postAdminUserContentUnblock
      tags: [admin-users]
      summary: Pulihkan izin membuat konten
      description: |
        Butuh izin `user.block_content` global. Tanpa izin → 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Izin membuat konten dipulihkan.
        default:
          $ref: "#/components/responses/Problem"
  /admin/account-cards:
    get:
      operationId: getAdminAccountCards
      tags: [admin-users]
      summary: Ekspor kartu akun per kelas
      description: |
        Mengembalikan PDF berisi kartu akun siswa kelas yang belum aktivasi dan
        masih memiliki sandi awal yang berlaku (nama, NISN, sandi awal).
        Butuh izin `user.reset_password` pada jurusan kelas terkait. Tanpa izin →
        404. Bila tidak ada siswa yang memenuhi syarat → 422. Setiap ekspor
        dicatat di audit log.
      parameters:
        - name: classId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Berkas PDF kartu akun.
          headers:
            Content-Disposition:
              description: Nama berkas unduhan, mis. kartu-akun-x-rpl-a.pdf
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"
  /admin/imports:
    get:
      operationId: getAdminImports
      tags: [admin-imports]
      summary: Daftar impor terakhir
      description: |
        Butuh izin `academic.import`. Tanpa izin → 404. Admin global melihat
        seluruh impor; admin jurusan hanya melihat impor yang ia buat sendiri.
        Maksimal 20 impor terbaru.
      responses:
        "200":
          description: Daftar impor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJobList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: postAdminImport
      tags: [admin-imports]
      summary: Unggah dan validasi CSV
      description: |
        Mengunggah berkas CSV berisi siswa, guru, atau tendik. Berkas langsung
        divalidasi per baris dan hasilnya menjadi `ImportJob` berstatus `ready`
        atau `invalid`. Format siswa: `nisn,nama,kelas[,tahun_masuk]`; guru:
        `nip,nama[,jurusan]`; tendik: `nip,nama` (NIP boleh kosong). Pemisah
        koma atau titik koma dideteksi otomatis. Maksimal 2 MB dan 5000 baris.
        Butuh izin `academic.import`; admin jurusan hanya boleh mengimpor siswa
        ke kelas pada jurusannya dan tidak boleh mengimpor guru/tendik.
        Tanpa izin → 404.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind:
                  $ref: "#/components/schemas/ImportKind"
                file:
                  type: string
                  format: binary
                  description: Berkas CSV UTF-8.
      responses:
        "201":
          description: Hasil unggah dan validasi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJob"
        default:
          $ref: "#/components/responses/Problem"
  /admin/imports/{id}:
    get:
      operationId: getAdminImport
      tags: [admin-imports]
      summary: Detail impor
      description: |
        Butuh izin `academic.import`. Admin global dapat melihat semua impor;
        admin jurusan hanya impor yang ia buat sendiri. Di luar itu → 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Detail impor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJob"
        default:
          $ref: "#/components/responses/Problem"
  /admin/imports/{id}/commit:
    post:
      operationId: postAdminImportCommit
      tags: [admin-imports]
      summary: Jalankan impor
      description: |
        Menjalankan impor berstatus `ready` sebagai tugas latar belakang. Hanya
        pembuat impor atau pemegang izin `academic.import` global yang boleh
        menjalankannya; di luar itu → 404. Status selain `ready` → 409
        `INVALID_TRANSITION`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Impor sedang dijalankan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJob"
        default:
          $ref: "#/components/responses/Problem"
  /admin/permissions:
    get:
      operationId: getAdminPermissions
      tags: [admin-roles]
      summary: Katalog izin
      description: |
        Butuh izin `role.manage` global atau `role.assign`. Tanpa izin → 404.
      responses:
        "200":
          description: Katalog izin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPermissionList"
        default:
          $ref: "#/components/responses/Problem"
  /admin/roles:
    get:
      operationId: getAdminRoles
      tags: [admin-roles]
      summary: Daftar role
      description: |
        Butuh izin `role.manage` global atau `role.assign`. Tanpa izin → 404.
        Termasuk role sistem dan role kustom beserta izin dan jumlah pemiliknya.
      responses:
        "200":
          description: Daftar role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRoleList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: postAdminRole
      tags: [admin-roles]
      summary: Buat role kustom
      description: |
        Butuh izin `role.manage` global. Tanpa izin → 404. Setiap izin harus ada
        di katalog dan dimiliki aktor secara global. Slug duplikat → 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRoleCreate"
      responses:
        "201":
          description: Role dibuat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRole"
        default:
          $ref: "#/components/responses/Problem"
  /admin/roles/{id}:
    patch:
      operationId: patchAdminRole
      tags: [admin-roles]
      summary: Ubah role
      description: |
        Butuh izin `role.manage` global. Tanpa izin → 404.
        Hanya nama dan deskripsi yang dapat diubah; slug dan izin role sistem
        tidak berubah. Field yang tidak dikirim tidak berubah.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRoleUpdate"
      responses:
        "200":
          description: Role diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRole"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteAdminRole
      tags: [admin-roles]
      summary: Hapus role kustom
      description: |
        Butuh izin `role.manage` global. Tanpa izin → 404.
        Role sistem atau role yang masih dimiliki pengguna → 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Role dihapus.
        default:
          $ref: "#/components/responses/Problem"
  /admin/roles/{id}/permissions:
    put:
      operationId: putAdminRolePermissions
      tags: [admin-roles]
      summary: Ganti izin role
      description: |
        Butuh izin `role.manage` global. Tanpa izin → 404.
        Mengganti seluruh himpunan izin role kustom. Setiap izin baru harus
        dimiliki aktor secara global. Role sistem → 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRolePermissionsUpdate"
      responses:
        "200":
          description: Izin role diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRole"
        default:
          $ref: "#/components/responses/Problem"
  /admin/users/{id}/roles:
    get:
      operationId: getAdminUserRoles
      tags: [admin-roles]
      summary: Daftar role pengguna
      description: |
        Butuh izin `role.assign`. Tanpa izin atau di luar cakupan jurusan → 404.
        Admin jurusan hanya melihat penugasan dalam cakupannya.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Penugasan role aktif pengguna.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRoleAssignmentList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: postAdminUserRole
      tags: [admin-roles]
      summary: Beri role ke pengguna
      description: |
        Butuh izin `role.assign` pada cakupan penugasan dan seluruh izin role
        yang diberikan pada cakupan yang sama. Tanpa izin atau di luar cakupan
        jurusan → 404. Role implisit (`member`, `teacher`) → 422.
        Role yang hanya bisa global tidak dapat diberi dengan `majorId` → 422.
        Penugasan ganda → 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRoleAssign"
      responses:
        "201":
          description: Role diberikan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRoleAssignment"
        default:
          $ref: "#/components/responses/Problem"
  /admin/user-roles/{assignmentId}:
    delete:
      operationId: deleteAdminUserRole
      tags: [admin-roles]
      summary: Cabut penugasan role
      description: |
        Butuh izin `role.assign` dan izin role tersebut pada cakupan penugasan.
        Tanpa izin atau di luar cakupan jurusan → 404.
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Penugasan dicabut.
        default:
          $ref: "#/components/responses/Problem"
  /admin/audit-logs:
    get:
      operationId: getAdminAuditLogs
      tags: [admin-audit]
      summary: Daftar audit log
      description: |
        Butuh izin `audit.view`. Tanpa izin → 404. Pemegang izin global melihat
        seluruh entri; pemegang izin ber-scope jurusan hanya melihat entri
        dengan `scopeMajorId` pada jurusannya (entri tanpa scope jurusan
        disembunyikan). `actorIp` hanya dikirim ke pemegang izin global.
        Hasil terbaru lebih dulu dan berhalaman dengan `cursor`.
      parameters:
        - name: actorId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          required: false
          description: Nama aksi persis, misalnya `user.create`.
          schema:
            type: string
        - name: actionPrefix
          in: query
          required: false
          description: Awalan aksi, misalnya `user.`.
          schema:
            type: string
        - name: targetType
          in: query
          required: false
          schema:
            type: string
        - name: targetId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: majorId
          in: query
          required: false
          description: Filter entri yang dicatat untuk jurusan ini.
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          required: false
          description: Cursor halaman berikutnya dari `nextCursor`.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Daftar audit log.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogPage"
        default:
          $ref: "#/components/responses/Problem"
  /media:
    post:
      operationId: postMedia
      tags: [media]
      summary: Unggah media
      description: |
        Menerima satu berkas lewat `multipart/form-data` dengan field `purpose`
        lalu `file`. Berkas diperiksa dari isinya (bukan nama atau header),
        disimpan di bucket privat, dan diproses asinkron. Respons `202` berisi
        media dengan status `uploaded`.

        Butuh izin `content.create`, kecuali `avatar` dan `banner` yang tetap
        diizinkan meskipun pembuatan konten sedang diblokir.

        Header `Idempotency-Key` didokumentasikan untuk klien, tetapi belum
        diterapkan oleh server.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [purpose, file]
              properties:
                purpose:
                  $ref: "#/components/schemas/MediaPurpose"
                file:
                  type: string
                  format: binary
      responses:
        "202":
          description: Media diterima dan menunggu diproses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAsset"
        default:
          $ref: "#/components/responses/Problem"
  /media/{id}:
    get:
      operationId: getMedia
      tags: [media]
      summary: Detail media
      description: Hanya pemilik media yang dapat melihat detailnya.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Detail media.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAsset"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteMedia
      tags: [media]
      summary: Hapus media
      description: |
        Hanya pemilik media. Ditolak dengan `CONFLICT` jika media masih dipakai
        konten, profil, grup, atau experience.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Media dihapus.
        default:
          $ref: "#/components/responses/Problem"
  /media/{id}/{variant}:
    get:
      operationId: getMediaVariant
      tags: [media]
      summary: Stream varian media
      description: |
        Mengalirkan berkas media dari bucket privat. Nama varian `original`
        hanya dapat diakses pemilik media.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: variant
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Berkas media.
          headers:
            Cache-Control:
              schema:
                type: string
            Content-Type:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"
  /contents:
    get:
      operationId: getContents
      tags: [contents]
      summary: Katalog konten tayang (Katalog Karya & Blog)
      description: Hanya konten berstatus published. Paginasi cursor berdasarkan waktu terbit pertama.
      parameters:
        - {name: type, in: query, schema: {$ref: "#/components/schemas/ContentType"}}
        - {name: sort, in: query, schema: {type: string, enum: [latest, popular], default: latest}}
        - {name: period, in: query, description: Hanya untuk sort=popular., schema: {type: string, enum: [7d, 30d, all], default: all}}
        - {name: category, in: query, description: Slug kategori., schema: {type: string, maxLength: 60}}
        - {name: major, in: query, description: Kode jurusan (konten yang salah satu author-nya anggota jurusan itu)., schema: {type: string, maxLength: 20}}
        - {name: tool, in: query, schema: {type: string, maxLength: 60}}
        - {name: skill, in: query, schema: {type: string, maxLength: 60}}
        - {name: tag, in: query, schema: {type: string, maxLength: 40}}
        - {name: context, in: query, schema: {$ref: "#/components/schemas/PortfolioContext"}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 200}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        "200":
          description: Satu halaman kartu konten.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ContentCardPage"}
        default: {$ref: "#/components/responses/Problem"}
  /contents/{publicId}:
    get:
      operationId: getContent
      tags: [contents]
      summary: Detail konten
      description: |
        Publik hanya bisa membuka konten published (selain itu 404). Author dan moderator yang
        berwenang juga bisa membuka status lain; respons memuat `status` agar UI menampilkan banner.
      parameters:
        - {name: publicId, in: path, required: true, schema: {type: string, pattern: "^[0-9a-z]{8}$"}}
      responses:
        "200":
          description: Detail konten (versi tayang, atau draf untuk author jika belum pernah tayang).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ContentDetail"}
        default: {$ref: "#/components/responses/Problem"}
  /taxonomy/categories:
    get:
      operationId: getTaxonomyCategories
      tags: [taxonomy]
      summary: Kategori konten
      parameters:
        - {name: type, in: query, required: true, schema: {$ref: "#/components/schemas/ContentType"}}
      responses:
        "200":
          description: Daftar kategori aktif berurutan.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CategoryList"}
        default: {$ref: "#/components/responses/Problem"}
  /taxonomy/tools:
    get:
      operationId: getTaxonomyTools
      tags: [taxonomy]
      summary: Cari tools/software (autocomplete)
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 60}}
      responses:
        "200":
          description: Maksimal 20 hasil.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaxonomyTermList"}
        default: {$ref: "#/components/responses/Problem"}
  /taxonomy/tags:
    get:
      operationId: getTaxonomyTags
      tags: [taxonomy]
      summary: Cari tag (autocomplete)
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 40}}
      responses:
        "200":
          description: Maksimal 20 hasil.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaxonomyTermList"}
        default: {$ref: "#/components/responses/Problem"}
  /studio/summary:
    get:
      operationId: getStudioSummary
      tags: [studio]
      summary: Ringkasan Studio (jumlah per status + undangan pending)
      responses:
        "200":
          description: Ringkasan.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StudioSummary"}
        default: {$ref: "#/components/responses/Problem"}
  /studio/contents:
    get:
      operationId: getStudioContents
      tags: [studio]
      summary: Konten saya (sebagai author accepted)
      parameters:
        - {name: status, in: query, schema: {$ref: "#/components/schemas/ContentStatus"}}
        - {name: type, in: query, schema: {$ref: "#/components/schemas/ContentType"}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 200}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        "200":
          description: Satu halaman konten Studio.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StudioContentPage"}
        default: {$ref: "#/components/responses/Problem"}
    post:
      operationId: postStudioContent
      tags: [studio]
      summary: Buat konten baru (draf kosong)
      description: Butuh izin content.create. Batas draf aktif mengikuti setting content.max_active_drafts.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StudioContentCreate"}
      responses:
        "201":
          description: Konten draf baru.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StudioContent"}
        default: {$ref: "#/components/responses/Problem"}
  /studio/contents/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getStudioContent
      tags: [studio]
      summary: Detail konten untuk editor
      responses:
        "200":
          description: Draf, status, keputusan moderasi terakhir, dan author.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StudioContent"}
        default: {$ref: "#/components/responses/Problem"}
    delete:
      operationId: deleteStudioContent
      tags: [studio]
      summary: Hapus konten (soft delete 30 hari, hanya pemilik)
      responses:
        "204": {description: Dipindah ke sampah.}
        default: {$ref: "#/components/responses/Problem"}
  /studio/contents/{id}/draft:
    put:
      operationId: putStudioContentDraft
      tags: [studio]
      summary: Simpan draf (autosave)
      description: |
        Pemilik/editor. Ditolak saat in_review/rejected. `lockVersion` wajib sama dengan versi server;
        jika tidak → 409 LOCK_CONFLICT dan klien memuat ulang. Validasi penuh hanya saat submit.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DraftInput"}
      responses:
        "200":
          description: Draf tersimpan (lockVersion baru).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StudioContent"}
        default: {$ref: "#/components/responses/Problem"}
  /studio/contents/{id}/submit:
    post:
      operationId: postStudioContentSubmit
      tags: [studio]
      summary: Kirim ke moderasi
      description: Pemilik. Validasi penuh, membuat versi snapshot imutabel dan kasus moderasi.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Konten in_review (atau revisi in_review).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StudioContent"}
        default: {$ref: "#/components/responses/Problem"}
  /studio/contents/{id}/withdraw:
    post:
      operationId: postStudioContentWithdraw
      tags: [studio]
      summary: Tarik kembali dari moderasi (selama belum di-claim)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Kembali ke draf.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StudioContent"}
        default: {$ref: "#/components/responses/Problem"}
  /studio/contents/{id}/revision:
    post:
      operationId: postStudioContentRevision
      tags: [studio]
      summary: Mulai revisi atas konten tayang
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Draf diisi dari versi tayang, revisionStatus editing.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StudioContent"}
        default: {$ref: "#/components/responses/Problem"}
    delete:
      operationId: deleteStudioContentRevision
      tags: [studio]
      summary: Buang revisi yang belum dikirim
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Revisi dibuang.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StudioContent"}
        default: {$ref: "#/components/responses/Problem"}
  /studio/contents/{id}/archive:
    post:
      operationId: postStudioContentArchive
      tags: [studio]
      summary: Arsipkan konten tayang (pemilik)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Diarsipkan.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StudioContent"}
        default: {$ref: "#/components/responses/Problem"}
  /studio/contents/{id}/unarchive:
    post:
      operationId: postStudioContentUnarchive
      tags: [studio]
      summary: Terbitkan kembali konten arsip tanpa review (pemilik)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Tayang kembali.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StudioContent"}
        default: {$ref: "#/components/responses/Problem"}
  /studio/contents/{id}/restore:
    post:
      operationId: postStudioContentRestore
      tags: [studio]
      summary: Pulihkan dari sampah (pemilik, ≤ 30 hari)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Kembali ke status sebelum dihapus.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StudioContent"}
        default: {$ref: "#/components/responses/Problem"}
  /studio/contents/{id}/versions:
    get:
      operationId: getStudioContentVersions
      tags: [studio]
      summary: Riwayat versi + keputusan moderasi
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Versi terbaru dulu.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ContentVersionList"}
        default: {$ref: "#/components/responses/Problem"}
  /studio/contents/{id}/versions/{versionId}:
    get:
      operationId: getStudioContentVersion
      tags: [studio]
      summary: Snapshot satu versi
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: versionId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Snapshot lengkap.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ContentVersionDetail"}
        default: {$ref: "#/components/responses/Problem"}
  /studio/contents/{id}/appeal:
    post:
      operationId: postStudioContentAppeal
      tags: [studio]
      summary: Ajukan banding atas penolakan (sekali per penolakan, pemilik)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AppealCreate"}
      responses:
        "201":
          description: Banding diterima.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Appeal"}
        default: {$ref: "#/components/responses/Problem"}
  /studio/contents/{id}/authors:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getStudioContentAuthors
      tags: [studio]
      summary: Daftar author (termasuk undangan pending)
      responses:
        "200":
          description: Author berurutan.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ContentAuthorList"}
        default: {$ref: "#/components/responses/Problem"}
    post:
      operationId: postStudioContentAuthor
      tags: [studio]
      summary: Undang kolaborator (pemilik)
      description: Batas jumlah author dari setting collab.max_authors_portfolio / collab.max_authors_blog.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AuthorInvite"}
      responses:
        "201":
          description: Undangan dibuat (kedaluwarsa 14 hari).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ContentAuthor"}
        default: {$ref: "#/components/responses/Problem"}
  /studio/contents/{id}/authors/{userId}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      operationId: patchStudioContentAuthor
      tags: [studio]
      summary: Ubah level / label peran / urutan author (pemilik)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AuthorUpdate"}
      responses:
        "200":
          description: Author diperbarui.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ContentAuthor"}
        default: {$ref: "#/components/responses/Problem"}
    delete:
      operationId: deleteStudioContentAuthor
      tags: [studio]
      summary: Keluarkan author / batalkan undangan (pemilik)
      responses:
        "204": {description: Dikeluarkan.}
        default: {$ref: "#/components/responses/Problem"}
  /studio/contents/{id}/transfer-ownership:
    post:
      operationId: postStudioContentTransferOwnership
      tags: [studio]
      summary: Pindahkan kepemilikan ke author accepted (pemilik lama jadi editor)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OwnershipTransfer"}
      responses:
        "200":
          description: Kepemilikan dipindah.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ContentAuthorList"}
        default: {$ref: "#/components/responses/Problem"}
  /studio/contents/{id}/leave:
    post:
      operationId: postStudioContentLeave
      tags: [studio]
      summary: Keluar dari konten (editor/kontributor)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Keluar.}
        default: {$ref: "#/components/responses/Problem"}
  /studio/invitations:
    get:
      operationId: getStudioInvitations
      tags: [studio]
      summary: Undangan kolaborasi yang masuk (pending)
      parameters:
        - {name: cursor, in: query, schema: {type: string, maxLength: 200}}
      responses:
        "200":
          description: Undangan pending.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InvitationPage"}
        default: {$ref: "#/components/responses/Problem"}
  /studio/invitations/{contentId}/accept:
    post:
      operationId: postStudioInvitationAccept
      tags: [studio]
      summary: Terima undangan
      parameters:
        - {name: contentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Diterima.}
        default: {$ref: "#/components/responses/Problem"}
  /studio/invitations/{contentId}/decline:
    post:
      operationId: postStudioInvitationDecline
      tags: [studio]
      summary: Tolak undangan
      parameters:
        - {name: contentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Ditolak.}
        default: {$ref: "#/components/responses/Problem"}
  /me:
    get:
      operationId: getMe
      tags: [profile]
      summary: Profil saya
      description: Data lengkap profil milik sendiri, termasuk ketersediaan ganti username.
      responses:
        "200":
          description: Profil milik sendiri.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfile"
        default:
          $ref: "#/components/responses/Problem"
  /me/profile:
    patch:
      operationId: patchMeProfile
      tags: [profile]
      summary: Ubah profil saya
      description: |
        Field yang tidak dikirim tidak berubah. String di-trim; string kosong
        pada `headline`, `bio`, dan `city` mengosongkan nilai. `teachingSubjects`
        hanya untuk akun guru.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Profil diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfile"
        default:
          $ref: "#/components/responses/Problem"
  /me/avatar:
    put:
      operationId: putMeAvatar
      tags: [profile]
      summary: Setel foto profil
      description: |
        `mediaId` harus media milik sendiri, berjenis gambar, dan ber-purpose
        `avatar`. Kirim `null` untuk mengosongkan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaSelection"
      responses:
        "200":
          description: Foto profil diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfile"
        default:
          $ref: "#/components/responses/Problem"
  /me/banner:
    put:
      operationId: putMeBanner
      tags: [profile]
      summary: Setel banner profil
      description: |
        `mediaId` harus media milik sendiri, berjenis gambar, dan ber-purpose
        `banner`. Kirim `null` untuk mengosongkan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaSelection"
      responses:
        "200":
          description: Banner profil diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfile"
        default:
          $ref: "#/components/responses/Problem"
  /me/links:
    put:
      operationId: putMeLinks
      tags: [profile]
      summary: Ganti tautan profil
      description: Mengganti seluruh daftar tautan. Urutan mengikuti urutan kiriman.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileLinksInput"
      responses:
        "200":
          description: Tautan profil diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfile"
        default:
          $ref: "#/components/responses/Problem"
  /me/skills:
    put:
      operationId: putMeSkills
      tags: [profile]
      summary: Ganti daftar skill
      description: Mengganti seluruh daftar skill. Urutan mengikuti urutan kiriman.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileSkillsInput"
      responses:
        "200":
          description: Skill diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfile"
        default:
          $ref: "#/components/responses/Problem"
  /me/username:
    patch:
      operationId: patchMeUsername
      tags: [profile]
      summary: Ganti username
      description: |
        Maksimal satu kali per 30 hari. Username lama dialihkan ke username baru
        selama 90 hari. Terlalu cepat → 409 `LIMIT_REACHED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsernameChange"
      responses:
        "200":
          description: Username diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfile"
        default:
          $ref: "#/components/responses/Problem"
  /me/experiences:
    get:
      operationId: getMeExperiences
      tags: [profile]
      summary: Daftar experience saya
      responses:
        "200":
          description: Daftar experience milik sendiri.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperienceList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: postMeExperience
      tags: [profile]
      summary: Tambah experience
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperienceInput"
      responses:
        "201":
          description: Experience dibuat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experience"
        default:
          $ref: "#/components/responses/Problem"
  /me/experiences/{id}:
    patch:
      operationId: patchMeExperience
      tags: [profile]
      summary: Ubah experience
      description: Entri sistem yang dikelola sekolah tidak dapat diubah → 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperienceInput"
      responses:
        "200":
          description: Experience diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experience"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteMeExperience
      tags: [profile]
      summary: Hapus experience
      description: Entri sistem yang dikelola sekolah tidak dapat dihapus → 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Experience dihapus.
        default:
          $ref: "#/components/responses/Problem"
  /users/{username}:
    get:
      operationId: getUser
      tags: [users]
      summary: Profil pengguna publik
      description: |
        Profil publik tanpa data identitas. Username yang sudah diganti
        menghasilkan `301` dengan header `Location` ke profil baru selama masa
        redirect masih berlaku. Pengguna nonaktif atau belum aktivasi → 404.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: Profil publik.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfile"
        "301":
          description: Username lama dialihkan ke username baru.
          headers:
            Location:
              required: true
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
  /users/{username}/experiences:
    get:
      operationId: getUserExperiences
      tags: [users]
      summary: Experience pengguna
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: Daftar experience pengguna.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperienceList"
        default:
          $ref: "#/components/responses/Problem"
  /users/{username}/followers:
    get:
      operationId: getUserFollowers
      tags: [users]
      summary: Pengikut pengguna
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
        - name: cursor
          in: query
          required: false
          description: Cursor halaman berikutnya dari `nextCursor`.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Daftar pengikut.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMiniPage"
        default:
          $ref: "#/components/responses/Problem"
  /users/{username}/following:
    get:
      operationId: getUserFollowing
      tags: [users]
      summary: Pengguna yang diikuti
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
        - name: cursor
          in: query
          required: false
          description: Cursor halaman berikutnya dari `nextCursor`.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Daftar pengguna yang diikuti.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMiniPage"
        default:
          $ref: "#/components/responses/Problem"
  /users/{username}/follow:
    put:
      operationId: putUserFollow
      tags: [users]
      summary: Ikuti pengguna
      description: Idempoten. Mengikuti diri sendiri → 422.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        "204":
          description: Sudah mengikuti.
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteUserFollow
      tags: [users]
      summary: Berhenti mengikuti pengguna
      description: Idempoten.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        "204":
          description: Tidak lagi mengikuti.
        default:
          $ref: "#/components/responses/Problem"
  /users/{username}/skills/{skillSlug}/endorsement:
    put:
      operationId: putUserSkillEndorsement
      tags: [users]
      summary: Endorse skill pengguna
      description: Idempoten. Mengendorse diri sendiri → 422.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
        - name: skillSlug
          in: path
          required: true
          schema:
            type: string
            maxLength: 60
      responses:
        "204":
          description: Endorsement tercatat.
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteUserSkillEndorsement
      tags: [users]
      summary: Batalkan endorse skill pengguna
      description: Idempoten.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
        - name: skillSlug
          in: path
          required: true
          schema:
            type: string
            maxLength: 60
      responses:
        "204":
          description: Endorsement dibatalkan.
        default:
          $ref: "#/components/responses/Problem"
  /taxonomy/skills:
    get:
      operationId: getTaxonomySkills
      tags: [taxonomy]
      summary: Cari skill
      description: Autocomplete katalog skill aktif, maksimal 20 hasil.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: Daftar skill.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillOptionList"
        default:
          $ref: "#/components/responses/Problem"
components:
  schemas:
    ContentType:
      type: string
      enum: [portfolio, blog]
    ContentStatus:
      type: string
      enum: [draft, in_review, changes_requested, published, archived, taken_down, rejected, deleted]
    RevisionStatus:
      type: string
      description: Status revisi atas konten tayang (hanya saat status published).
      enum: [editing, in_review, changes_requested]
    AuthorLevel:
      type: string
      enum: [owner, editor, contributor]
    InviteStatus:
      type: string
      enum: [pending, accepted, declined, expired, left, removed]
    PortfolioContext:
      type: string
      enum: [assignment, internship, competition, ukk, personal, other]
    AuthorMini:
      type: object
      required: [userId, displayName]
      properties:
        userId: {type: string, format: uuid}
        username: {type: string, nullable: true}
        displayName: {type: string}
        avatarUrl: {type: string, nullable: true}
    ImageRef:
      type: object
      description: Referensi gambar. `url` kosong sampai media diproses/dipublikasikan.
      required: [mediaId]
      properties:
        mediaId: {type: string, format: uuid}
        url: {type: string, nullable: true}
        w: {type: integer, nullable: true}
        h: {type: integer, nullable: true}
        blurhash: {type: string, nullable: true}
        dominantColor: {type: string, nullable: true}
    CategoryRef:
      type: object
      required: [slug, name]
      properties:
        slug: {type: string}
        name: {type: string}
    CategoryOption:
      type: object
      required: [id, slug, name, majorCodes]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        name: {type: string}
        description: {type: string, nullable: true}
        majorCodes:
          type: array
          description: Jurusan yang disarankan untuk kategori ini.
          items: {type: string}
    CategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/CategoryOption"}
    TaxonomyTerm:
      type: object
      required: [slug, name]
      properties:
        slug: {type: string}
        name: {type: string}
        category: {type: string, nullable: true}
    TaxonomyTermList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/TaxonomyTerm"}
    ContentStats:
      type: object
      required: [appreciations, comments]
      properties:
        appreciations: {type: integer}
        comments: {type: integer}
    ContentAuthorsPreview:
      type: object
      required: [preview, total]
      properties:
        preview:
          type: array
          description: Maksimal 3 author pertama (urutan tampil).
          items: {$ref: "#/components/schemas/AuthorMini"}
        total: {type: integer}
    ContentCardViewer:
      type: object
      required: [appreciated, bookmarked]
      properties:
        appreciated: {type: boolean}
        bookmarked: {type: boolean}
    ContentCard:
      type: object
      required: [publicId, type, slug, title, authors, stats, firstPublishedAt]
      properties:
        publicId: {type: string}
        type: {$ref: "#/components/schemas/ContentType"}
        slug: {type: string}
        title: {type: string}
        excerpt: {type: string, nullable: true}
        cover:
          allOf: [{$ref: "#/components/schemas/ImageRef"}]
          nullable: true
        category:
          allOf: [{$ref: "#/components/schemas/CategoryRef"}]
          nullable: true
        authors: {$ref: "#/components/schemas/ContentAuthorsPreview"}
        stats: {$ref: "#/components/schemas/ContentStats"}
        viewer:
          allOf: [{$ref: "#/components/schemas/ContentCardViewer"}]
          nullable: true
          description: Hanya jika login.
        readingMinutes: {type: integer, nullable: true}
        firstPublishedAt: {type: string, format: date-time}
    ContentCardPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ContentCard"}
        nextCursor: {type: string, nullable: true}
    ContentAuthor:
      type: object
      required: [user, level, position, inviteStatus, invitedAt]
      properties:
        user: {$ref: "#/components/schemas/AuthorMini"}
        level: {$ref: "#/components/schemas/AuthorLevel"}
        roleLabel: {type: string, nullable: true, description: "Label peran, mis. Animator."}
        position: {type: integer}
        inviteStatus: {$ref: "#/components/schemas/InviteStatus"}
        invitedAt: {type: string, format: date-time}
        inviteExpiresAt: {type: string, format: date-time, nullable: true}
    ContentAuthorList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ContentAuthor"}
    AuthorInvite:
      type: object
      required: [userId, level]
      properties:
        userId: {type: string, format: uuid}
        level: {type: string, enum: [editor, contributor]}
        roleLabel: {type: string, maxLength: 60}
    AuthorUpdate:
      type: object
      properties:
        level: {type: string, enum: [editor, contributor]}
        roleLabel: {type: string, maxLength: 60, nullable: true}
        position: {type: integer, minimum: 0, maximum: 1000}
    OwnershipTransfer:
      type: object
      required: [userId]
      properties:
        userId: {type: string, format: uuid}
    ContentDetailViewer:
      type: object
      required: [appreciated, bookmarked, isAuthor]
      properties:
        appreciated: {type: boolean}
        bookmarked: {type: boolean}
        isAuthor: {type: boolean}
        authorLevel:
          allOf: [{$ref: "#/components/schemas/AuthorLevel"}]
          nullable: true
    ContentDetail:
      type: object
      required: [publicId, type, status, slug, title, tags, tools, skills, body, meta, authors, stats, legacyIncomplete]
      properties:
        publicId: {type: string}
        type: {$ref: "#/components/schemas/ContentType"}
        status: {$ref: "#/components/schemas/ContentStatus"}
        slug: {type: string}
        title: {type: string}
        excerpt: {type: string, nullable: true}
        cover:
          allOf: [{$ref: "#/components/schemas/ImageRef"}]
          nullable: true
        category:
          allOf: [{$ref: "#/components/schemas/CategoryRef"}]
          nullable: true
        tags:
          type: array
          items: {$ref: "#/components/schemas/TaxonomyTerm"}
        tools:
          type: array
