# Kode ini di-generate dari apps/api/internal/http/routes.go.
# JANGAN edit manual — jalankan `make openapi`.
# CI memverifikasi tidak ada drift (.github/workflows/ci.yml).
openapi: 3.1.0
info:
  title: Grafikarsa API
  version: 2.0.0
  description: |
    API katalog portfolio + jaringan sosial SMKN 4 Malang.
    Browser memanggil lewat BFF Next.js (/api/*); backend tidak diekspos publik.
    Autentikasi: Bearer access token (15 menit, disimpan di memori FE) +
    cookie refresh __Host-rt HttpOnly. Mutasi wajib memakai X-CSRF-Token
    yang cocok dengan cookie __Host-csrf (double-submit, terikat ke user).
    Permission ditulis sebagai x-permissions; admin melewati daftar itu,
    admin_jurusan dibatasi row-level scope (claim scope_major_id).
servers:
  - url: /
    description: Lewat BFF (produksi)
  - url: http://localhost:8091
    description: API langsung (hanya dev/jaringan internal)
