openapi: 3.0.3
info:
  title: Grafikarsa API
  version: 0.1.0
  description: |
    Kontrak API Grafikarsa. Berkas ini adalah sumber kebenaran (source of truth)
    untuk seluruh endpoint, skema permintaan, dan skema respons. Kode server Go
    dan klien TypeScript di-generate dari spesifikasi ini.
servers:
  - url: /api/v1
paths:
  /ping:
    get:
      operationId: getPing
      tags:
        - system
      summary: Cek API hidup
      responses:
        "200":
          description: API hidup dan siap menerima permintaan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pong"
        default:
          $ref: "#/components/responses/Problem"
  /auth/csrf:
    get:
      operationId: getAuthCsrf
      tags: [auth]
      summary: Ambil token CSRF
      description: |
        Mengatur cookie `__Host-gk_csrf` dan mengembalikan nilainya. Klien wajib
        mengirim nilai ini di header `X-CSRF-Token` untuk setiap request yang mengubah data.
      responses:
        "200":
          description: Token CSRF.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfToken"
        default:
          $ref: "#/components/responses/Problem"
  /auth/login:
    post:
      operationId: postAuthLogin
      tags: [auth]
      summary: Masuk dengan NISN/NIP/username dan sandi
      description: |
        Berhasil → cookie sesi `__Host-gk_session` diatur dan cookie CSRF diputar.
        `nextStep` memberi tahu klien halaman wajib berikutnya.
        Gagal → 401 `INVALID_CREDENTIALS` (pesan sama untuk identitas tidak ada dan sandi salah).
        Terlalu banyak percobaan → 429 `RATE_LIMITED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Berhasil masuk.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"
  /auth/logout:
    post:
      operationId: postAuthLogout
      tags: [auth]
      summary: Keluar (cabut sesi ini)
      responses:
        "204":
          description: Sesi dicabut dan cookie dihapus.
        default:
          $ref: "#/components/responses/Problem"
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Sesi saat ini
      description: Mengembalikan sesi aktif. Tanpa sesi → 401 `UNAUTHENTICATED`.
      responses:
        "200":
          description: Sesi aktif.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"
  /auth/username-availability:
    get:
      operationId: getAuthUsernameAvailability
      tags: [auth]
      summary: Cek ketersediaan username
      description: Butuh sesi (boleh belum aktivasi).
      parameters:
        - name: u
          in: query
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: Hasil pengecekan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsernameAvailability"
        default:
          $ref: "#/components/responses/Problem"
  /auth/activate:
    post:
      operationId: postAuthActivate
      tags: [auth]
      summary: Aktivasi akun (login pertama)
      description: |
        Hanya untuk sesi dengan `nextStep = activate`. Mengatur username dan sandi baru,
        lalu mengembalikan recovery code (hanya ditampilkan sekali). Aktivasi baru selesai
        setelah `POST /auth/recovery-codes/confirm`.
        Akun hasil migrasi v1 yang sudah punya username dan sandi boleh mengirim
        `newPassword` kosong untuk mempertahankan sandinya.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateRequest"
      responses:
        "200":
          description: Recovery code baru.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        default:
          $ref: "#/components/responses/Problem"
  /auth/recovery-codes/confirm:
    post:
      operationId: postAuthRecoveryCodesConfirm
      tags: [auth]
      summary: Konfirmasi recovery code sudah disimpan
      responses:
        "200":
          description: Aktivasi selesai, sesi diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"
  /auth/recovery-codes/regenerate:
    post:
      operationId: postAuthRecoveryCodesRegenerate
      tags: [auth]
      summary: Buat ulang recovery code
      description: Butuh sandi saat ini. Semua kode lama hangus.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirmation"
      responses:
        "200":
          description: Recovery code baru.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        default:
          $ref: "#/components/responses/Problem"
  /auth/password/recover:
    post:
      operationId: postAuthPasswordRecover
      tags: [auth]
      summary: Reset sandi dengan recovery code
      description: Tanpa sesi. Berhasil → semua sesi user dicabut, user harus masuk ulang.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoverPasswordRequest"
      responses:
        "204":
          description: Sandi diganti.
        default:
          $ref: "#/components/responses/Problem"
  /auth/password/change:
    post:
      operationId: postAuthPasswordChange
      tags: [auth]
      summary: Ganti sandi
      description: |
        `currentPassword` wajib kecuali sesi sedang `nextStep = change_password`
        (login dengan sandi sementara). Berhasil → sesi lain dicabut.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Sandi diganti, sesi saat ini diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"
  /auth/sessions:
    get:
      operationId: getAuthSessions
      tags: [auth]
      summary: Daftar sesi aktif milik user
      responses:
        "200":
          description: Sesi aktif.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDeviceList"
        default:
          $ref: "#/components/responses/Problem"
  /auth/sessions/{id}:
    delete:
      operationId: deleteAuthSession
      tags: [auth]
      summary: Cabut satu sesi milik user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Sesi dicabut.
        default:
          $ref: "#/components/responses/Problem"
  /auth/sessions/revoke-others:
    post:
      operationId: postAuthSessionsRevokeOthers
      tags: [auth]
      summary: Keluar dari semua perangkat lain
      responses:
        "204":
          description: Sesi lain dicabut.
        default:
          $ref: "#/components/responses/Problem"
  /majors:
    get:
      operationId: getMajors
      tags: [academic]
      summary: Daftar jurusan aktif
      description: Publik. Hanya mengembalikan jurusan yang aktif beserta grup cerminnya.
      responses:
        "200":
          description: Daftar jurusan aktif.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MajorList"
        default:
          $ref: "#/components/responses/Problem"
  /admin/majors:
    get:
      operationId: getAdminMajors
      tags: [admin-academic]
      summary: Daftar seluruh jurusan
      description: |
        Butuh izin `academic.manage_majors`, `academic.manage_years`,
        `academic.manage_classes`, atau `user.view`. Tanpa izin → 404.
        Termasuk jurusan yang sudah tidak aktif.
      responses:
        "200":
          description: Daftar seluruh jurusan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MajorList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: postAdminMajor
      tags: [admin-academic]
      summary: Buat jurusan
      description: |
        Membuat jurusan sekaligus grup cerminnya. Butuh izin `academic.manage_majors`.
        Tanpa izin → 404. Kode jurusan duplikat → 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MajorCreate"
      responses:
        "201":
          description: Jurusan dibuat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Major"
        default:
          $ref: "#/components/responses/Problem"
  /admin/majors/{id}:
    patch:
      operationId: patchAdminMajor
      tags: [admin-academic]
      summary: Ubah jurusan
      description: |
        Butuh izin `academic.manage_majors`. Tanpa izin → 404.
        Menonaktifkan jurusan memindahkan grupnya ke riwayat.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MajorUpdate"
      responses:
        "200":
          description: Jurusan diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Major"
        default:
          $ref: "#/components/responses/Problem"
  /admin/academic-years:
    get:
      operationId: getAdminAcademicYears
      tags: [admin-academic]
      summary: Daftar tahun ajaran
      description: |
        Butuh izin `academic.manage_majors`, `academic.manage_years`,
        `academic.manage_classes`, atau `user.view`. Tanpa izin → 404.
      responses:
        "200":
          description: Daftar tahun ajaran, terbaru lebih dulu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicYearList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: postAdminAcademicYear
      tags: [admin-academic]
      summary: Buat tahun ajaran
      description: |
        Butuh izin `academic.manage_years`. Tanpa izin → 404.
        Tahun ajaran duplikat → 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcademicYearCreate"
      responses:
        "201":
          description: Tahun ajaran dibuat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicYear"
        default:
          $ref: "#/components/responses/Problem"
  /admin/academic-years/{id}:
    patch:
      operationId: patchAdminAcademicYear
      tags: [admin-academic]
      summary: Ubah tanggal tahun ajaran
      description: |
        Butuh izin `academic.manage_years`. Tanpa izin → 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcademicYearUpdate"
      responses:
        "200":
          description: Tahun ajaran diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicYear"
        default:
          $ref: "#/components/responses/Problem"
  /admin/academic-years/{id}/set-current:
    post:
      operationId: postAdminAcademicYearSetCurrent
      tags: [admin-academic]
      summary: Tandai tahun ajaran sebagai tahun ajaran aktif
      description: |
        Butuh izin `academic.manage_years`. Tanpa izin → 404.
        Hanya satu tahun ajaran yang aktif dalam satu waktu.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Tahun ajaran aktif diperbarui.
        default:
          $ref: "#/components/responses/Problem"
  /admin/classes:
    get:
      operationId: getAdminClasses
      tags: [admin-academic]
      summary: Daftar kelas
      description: |
        Butuh izin `academic.manage_majors`, `academic.manage_years`,
        `academic.manage_classes`, atau `user.view`. Tanpa izin → 404.
      parameters:
        - name: academicYearId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: majorId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Daftar kelas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: postAdminClass
      tags: [admin-academic]
      summary: Buat kelas
      description: |
        Membuat kelas sekaligus grup cerminnya. Butuh izin `academic.manage_classes`
        pada jurusan terkait. Tanpa izin → 404. Kelas duplikat → 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassCreate"
      responses:
        "201":
          description: Kelas dibuat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
        default:
          $ref: "#/components/responses/Problem"
  /admin/classes/{id}:
    patch:
      operationId: patchAdminClass
      tags: [admin-academic]
      summary: Ubah rombel kelas
      description: |
        Butuh izin `academic.manage_classes` pada jurusan kelas terkait.
        Tanpa izin → 404. Kelas duplikat → 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassUpdate"
      responses:
        "200":
          description: Kelas diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteAdminClass
      tags: [admin-academic]
      summary: Hapus kelas
      description: |
        Butuh izin `academic.manage_classes` pada jurusan kelas terkait.
        Tanpa izin → 404. Kelas yang sudah punya siswa → 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Kelas dihapus.
        default:
          $ref: "#/components/responses/Problem"
  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin-users]
      summary: Daftar pengguna
      description: |
        Butuh izin `user.view`. Tanpa izin → 404. Admin jurusan hanya melihat
        pengguna pada jurusannya. Hasil terbaru lebih dulu dan berhalaman
        dengan `cursor`.
      parameters:
        - name: accountType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AccountType"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AccountStatus"
        - name: majorId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: classId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          required: false
          description: Cari pada nama tampilan, username, NISN, atau NIP/ID staf.
          schema:
            type: string
            maxLength: 100
        - name: cursor
          in: query
          required: false
          description: Cursor halaman berikutnya dari `nextCursor`.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Daftar pengguna.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: postAdminUser
      tags: [admin-users]
      summary: Buat pengguna
      description: |
        Butuh izin `user.create`. Admin jurusan hanya dapat membuat siswa pada
        jurusannya. NISN atau NIP/ID staf duplikat → 409.
        `initialPassword` hanya ditampilkan sekali pada respons ini dan tidak
        dapat diambil kembali.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserCreate"
      responses:
        "201":
          description: Pengguna dibuat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserCreated"
        default:
          $ref: "#/components/responses/Problem"
  /admin/users/{id}:
    get:
      operationId: getAdminUser
      tags: [admin-users]
      summary: Detail pengguna
      description: |
        Butuh izin `user.view`. Tanpa izin atau di luar jurusan admin → 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Detail pengguna.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchAdminUser
      tags: [admin-users]
      summary: Ubah pengguna
      description: |
        Butuh izin `user.update`. Tanpa izin atau di luar jurusan admin → 404.
        Field yang tidak dikirim tidak berubah. Mengirim NISN atau NIP/ID staf
        kosong akan mengosongkannya. NISN atau NIP/ID staf duplikat → 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Pengguna diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        default:
          $ref: "#/components/responses/Problem"
  /admin/users/{id}/deactivate:
    post:
      operationId: postAdminUserDeactivate
      tags: [admin-users]
      summary: Nonaktifkan pengguna
      description: |
        Butuh izin `user.deactivate`. Tanpa izin atau di luar jurusan admin → 404.
        Menonaktifkan akun mencabut seluruh sesinya.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Pengguna dinonaktifkan.
        default:
          $ref: "#/components/responses/Problem"
  /admin/users/{id}/reactivate:
    post:
      operationId: postAdminUserReactivate
      tags: [admin-users]
      summary: Aktifkan kembali pengguna
      description: |
        Butuh izin `user.deactivate`. Tanpa izin atau di luar jurusan admin → 404.
        Akun dengan tahun lulus kembali menjadi alumni.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Pengguna diaktifkan kembali.
        default:
          $ref: "#/components/responses/Problem"
  /admin/users/{id}/reset-password:
    post:
      operationId: postAdminUserResetPassword
      tags: [admin-users]
      summary: Reset sandi pengguna
      description: |
        Butuh izin `user.reset_password`. Tanpa izin atau di luar jurusan admin → 404.
        Hanya untuk akun yang sudah aktivasi; akun belum aktivasi memakai
        terbitkan ulang sandi awal. Seluruh sesi lama dicabut. `password` hanya
        ditampilkan sekali pada respons ini dan tidak dapat diambil kembali.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Sandi sementara diterbitkan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedPassword"
        default:
          $ref: "#/components/responses/Problem"
  /admin/users/{id}/reissue-initial-password:
    post:
      operationId: postAdminUserReissueInitialPassword
      tags: [admin-users]
      summary: Terbitkan ulang sandi awal
      description: |
        Butuh izin `user.reset_password`. Tanpa izin atau di luar jurusan admin → 404.
        Hanya untuk akun yang belum aktivasi; akun yang sudah aktivasi memakai
        reset sandi. `password` hanya ditampilkan sekali pada respons ini dan
        tidak dapat diambil kembali.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Sandi awal baru diterbitkan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedPassword"
        default:
          $ref: "#/components/responses/Problem"
  /admin/users/{id}/content-block:
    post:
      operationId: postAdminUserContentBlock
      tags: [admin-users]
      summary: Cabut izin membuat konten
      description: |
        Butuh izin `user.block_content` global. Tanpa izin → 404.
        Alasan wajib 3–300 karakter dan dicatat di audit log.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminContentBlockRequest"
      responses:
        "204":
          description: Izin membuat konten dicabut.
        default:
          $ref: "#/components/responses/Problem"
  /admin/users/{id}/content-unblock:
    post:
      operationId: postAdminUserContentUnblock
      tags: [admin-users]
      summary: Pulihkan izin membuat konten
      description: |
        Butuh izin `user.block_content` global. Tanpa izin → 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Izin membuat konten dipulihkan.
        default:
          $ref: "#/components/responses/Problem"
  /admin/account-cards:
    get:
      operationId: getAdminAccountCards
      tags: [admin-users]
      summary: Ekspor kartu akun per kelas
      description: |
        Mengembalikan PDF berisi kartu akun siswa kelas yang belum aktivasi dan
        masih memiliki sandi awal yang berlaku (nama, NISN, sandi awal).
        Butuh izin `user.reset_password` pada jurusan kelas terkait. Tanpa izin →
        404. Bila tidak ada siswa yang memenuhi syarat → 422. Setiap ekspor
        dicatat di audit log.
      parameters:
        - name: classId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Berkas PDF kartu akun.
          headers:
            Content-Disposition:
              description: Nama berkas unduhan, mis. kartu-akun-x-rpl-a.pdf
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"
  /admin/imports:
    get:
      operationId: getAdminImports
      tags: [admin-imports]
      summary: Daftar impor terakhir
      description: |
        Butuh izin `academic.import`. Tanpa izin → 404. Admin global melihat
        seluruh impor; admin jurusan hanya melihat impor yang ia buat sendiri.
        Maksimal 20 impor terbaru.
      responses:
        "200":
          description: Daftar impor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJobList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: postAdminImport
      tags: [admin-imports]
      summary: Unggah dan validasi CSV
      description: |
        Mengunggah berkas CSV berisi siswa, guru, atau tendik. Berkas langsung
        divalidasi per baris dan hasilnya menjadi `ImportJob` berstatus `ready`
        atau `invalid`. Format siswa: `nisn,nama,kelas[,tahun_masuk]`; guru:
        `nip,nama[,jurusan]`; tendik: `nip,nama` (NIP boleh kosong). Pemisah
        koma atau titik koma dideteksi otomatis. Maksimal 2 MB dan 5000 baris.
        Butuh izin `academic.import`; admin jurusan hanya boleh mengimpor siswa
        ke kelas pada jurusannya dan tidak boleh mengimpor guru/tendik.
        Tanpa izin → 404.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind:
                  $ref: "#/components/schemas/ImportKind"
                file:
                  type: string
                  format: binary
                  description: Berkas CSV UTF-8.
      responses:
        "201":
          description: Hasil unggah dan validasi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJob"
        default:
          $ref: "#/components/responses/Problem"
  /admin/imports/{id}:
    get:
      operationId: getAdminImport
      tags: [admin-imports]
      summary: Detail impor
      description: |
        Butuh izin `academic.import`. Admin global dapat melihat semua impor;
        admin jurusan hanya impor yang ia buat sendiri. Di luar itu → 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Detail impor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJob"
        default:
          $ref: "#/components/responses/Problem"
  /admin/imports/{id}/commit:
    post:
      operationId: postAdminImportCommit
      tags: [admin-imports]
      summary: Jalankan impor
      description: |
        Menjalankan impor berstatus `ready` sebagai tugas latar belakang. Hanya
        pembuat impor atau pemegang izin `academic.import` global yang boleh
        menjalankannya; di luar itu → 404. Status selain `ready` → 409
        `INVALID_TRANSITION`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Impor sedang dijalankan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJob"
        default:
          $ref: "#/components/responses/Problem"
  /admin/permissions:
    get:
      operationId: getAdminPermissions
      tags: [admin-roles]
      summary: Katalog izin
      description: |
        Butuh izin `role.manage` global atau `role.assign`. Tanpa izin → 404.
      responses:
        "200":
          description: Katalog izin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPermissionList"
        default:
          $ref: "#/components/responses/Problem"
  /admin/roles:
    get:
      operationId: getAdminRoles
      tags: [admin-roles]
      summary: Daftar role
      description: |
        Butuh izin `role.manage` global atau `role.assign`. Tanpa izin → 404.
        Termasuk role sistem dan role kustom beserta izin dan jumlah pemiliknya.
      responses:
        "200":
          description: Daftar role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRoleList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: postAdminRole
      tags: [admin-roles]
      summary: Buat role kustom
      description: |
        Butuh izin `role.manage` global. Tanpa izin → 404. Setiap izin harus ada
        di katalog dan dimiliki aktor secara global. Slug duplikat → 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRoleCreate"
      responses:
        "201":
          description: Role dibuat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRole"
        default:
          $ref: "#/components/responses/Problem"
  /admin/roles/{id}:
    patch:
      operationId: patchAdminRole
      tags: [admin-roles]
      summary: Ubah role
      description: |
        Butuh izin `role.manage` global. Tanpa izin → 404.
        Hanya nama dan deskripsi yang dapat diubah; slug dan izin role sistem
        tidak berubah. Field yang tidak dikirim tidak berubah.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRoleUpdate"
      responses:
        "200":
          description: Role diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRole"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteAdminRole
      tags: [admin-roles]
      summary: Hapus role kustom
      description: |
        Butuh izin `role.manage` global. Tanpa izin → 404.
        Role sistem atau role yang masih dimiliki pengguna → 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Role dihapus.
        default:
          $ref: "#/components/responses/Problem"
  /admin/roles/{id}/permissions:
    put:
      operationId: putAdminRolePermissions
      tags: [admin-roles]
      summary: Ganti izin role
      description: |
        Butuh izin `role.manage` global. Tanpa izin → 404.
        Mengganti seluruh himpunan izin role kustom. Setiap izin baru harus
        dimiliki aktor secara global. Role sistem → 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRolePermissionsUpdate"
      responses:
        "200":
          description: Izin role diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRole"
        default:
          $ref: "#/components/responses/Problem"
  /admin/users/{id}/roles:
    get:
      operationId: getAdminUserRoles
      tags: [admin-roles]
      summary: Daftar role pengguna
      description: |
        Butuh izin `role.assign`. Tanpa izin atau di luar cakupan jurusan → 404.
        Admin jurusan hanya melihat penugasan dalam cakupannya.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Penugasan role aktif pengguna.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRoleAssignmentList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: postAdminUserRole
      tags: [admin-roles]
      summary: Beri role ke pengguna
      description: |
        Butuh izin `role.assign` pada cakupan penugasan dan seluruh izin role
        yang diberikan pada cakupan yang sama. Tanpa izin atau di luar cakupan
        jurusan → 404. Role implisit (`member`, `teacher`) → 422.
        Role yang hanya bisa global tidak dapat diberi dengan `majorId` → 422.
        Penugasan ganda → 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRoleAssign"
      responses:
        "201":
          description: Role diberikan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRoleAssignment"
        default:
          $ref: "#/components/responses/Problem"
  /admin/user-roles/{assignmentId}:
    delete:
      operationId: deleteAdminUserRole
      tags: [admin-roles]
      summary: Cabut penugasan role
      description: |
        Butuh izin `role.assign` dan izin role tersebut pada cakupan penugasan.
        Tanpa izin atau di luar cakupan jurusan → 404.
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Penugasan dicabut.
        default:
          $ref: "#/components/responses/Problem"
components:
  schemas:
    CsrfToken:
      type: object
      required: [csrfToken]
      properties:
        csrfToken:
          type: string
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: NISN, NIP/ID staf, atau username.
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 128
    AccountType:
      type: string
      enum: [student, teacher, staff]
    AccountStatus:
      type: string
      enum: [active, alumni, transferred, inactive]
    NextStep:
      type: string
      description: |
        Halaman wajib berikutnya. `activate` → /aktivasi, `change_password` → /ganti-sandi,
        `none` → bebas. Selama bukan `none`, endpoint lain menolak dengan 403
        `ACTIVATION_REQUIRED` / `PASSWORD_CHANGE_REQUIRED`.
      enum: [activate, change_password, none]
    SessionUser:
      type: object
      required: [id, displayName, accountType, status]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          nullable: true
          description: Kosong sebelum aktivasi.
        displayName:
          type: string
        accountType:
          $ref: "#/components/schemas/AccountType"
        status:
          $ref: "#/components/schemas/AccountStatus"
        avatarUrl:
          type: string
          nullable: true
    RoleGrant:
      type: object
      description: Izin efektif user. `majorIds` kosong berarti scope global.
      required: [permission, global, majorIds]
      properties:
        permission:
          type: string
          example: content.moderate
        global:
          type: boolean
        majorIds:
          type: array
          items:
            type: string
            format: uuid
    Session:
      type: object
      required: [user, nextStep, grants, expiresAt]
      properties:
        user:
          $ref: "#/components/schemas/SessionUser"
        nextStep:
          $ref: "#/components/schemas/NextStep"
        grants:
          type: array
          items:
            $ref: "#/components/schemas/RoleGrant"
        isMigratedAccount:
          type: boolean
          description: Akun hasil migrasi v1 (aktivasi versi singkat).
        expiresAt:
          type: string
          format: date-time
    UsernameAvailability:
      type: object
      required: [username, available]
      properties:
        username:
          type: string
          description: Username yang sudah dinormalisasi (huruf kecil, tanpa spasi).
        available:
          type: boolean
        reason:
          type: string
          enum: [invalid_format, reserved, taken]
    ActivateRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
        newPassword:
          type: string
          maxLength: 128
    RecoveryCodes:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          description: Format `xxxxx-xxxxx`. Hanya ditampilkan sekali.
          items:
            type: string
    PasswordConfirmation:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 128
    RecoverPasswordRequest:
      type: object
      required: [identifier, recoveryCode, newPassword]
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 64
        recoveryCode:
          type: string
          minLength: 10
          maxLength: 20
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
    ChangePasswordRequest:
      type: object
      required: [newPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 128
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
    SessionDevice:
      type: object
      required: [id, current, createdAt, lastSeenAt]
      properties:
        id:
          type: string
          format: uuid
        current:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        userAgent:
          type: string
          nullable: true
        ipPrefix:
          type: string
          nullable: true
          description: IP yang disamarkan (mis. 103.134.78.x).
    SessionDeviceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionDevice"
    Major:
      type: object
      description: Data jurusan beserta grup cerminnya.
      required: [id, code, name, shortName, isActive, sortOrder, groupId]
      properties:
        id:
          type: string
          format: uuid
          description: ID jurusan.
        code:
          type: string
          description: Kode unik jurusan (huruf kecil).
        name:
          type: string
          description: Nama lengkap jurusan.
        shortName:
          type: string
          description: Nama singkat jurusan untuk nama kelas.
        isActive:
          type: boolean
          description: Apakah jurusan masih aktif.
        sortOrder:
          type: integer
          description: Urutan tampil jurusan.
        groupId:
          type: string
          format: uuid
          description: ID grup yang mencerminkan jurusan ini.
    MajorList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Major"
    MajorCreate:
      type: object
      required: [code, name, shortName]
      properties:
        code:
          type: string
          description: Kode jurusan, huruf kecil tanpa spasi.
        name:
          type: string
          description: Nama lengkap jurusan.
        shortName:
          type: string
          description: Nama singkat jurusan (huruf kapital).
        sortOrder:
          type: integer
          description: Urutan tampil jurusan. Default 0.
    MajorUpdate:
      type: object
      properties:
        name:
          type: string
          description: Nama lengkap jurusan.
        shortName:
          type: string
          description: Nama singkat jurusan (huruf kapital).
        sortOrder:
          type: integer
          description: Urutan tampil jurusan.
        isActive:
          type: boolean
          description: Aktif atau nonaktif.
    AcademicYear:
      type: object
      description: Satu tahun ajaran.
      required: [id, startYear, label, slug, startsOn, endsOn, isCurrent]
      properties:
        id:
          type: string
          format: uuid
          description: ID tahun ajaran.
        startYear:
          type: integer
          description: Tahun mulai, misalnya 2026.
        label:
          type: string
          description: Label tahun ajaran, misalnya "2026/2027".
        slug:
          type: string
          description: Slug tahun ajaran, misalnya "2026-2027".
        startsOn:
          type: string
          format: date
          description: Tanggal mulai tahun ajaran.
        endsOn:
          type: string
          format: date
          description: Tanggal selesai tahun ajaran.
        isCurrent:
          type: boolean
          description: Apakah ini tahun ajaran yang aktif saat ini.
    AcademicYearList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AcademicYear"
    AcademicYearCreate:
      type: object
      required: [startYear, startsOn, endsOn]
      properties:
        startYear:
          type: integer
          description: Tahun mulai, misalnya 2026.
        startsOn:
          type: string
          format: date
          description: Tanggal mulai tahun ajaran.
        endsOn:
          type: string
          format: date
          description: Tanggal selesai tahun ajaran.
    AcademicYearUpdate:
      type: object
      properties:
        startsOn:
          type: string
          format: date
          description: Tanggal mulai tahun ajaran.
        endsOn:
          type: string
          format: date
          description: Tanggal selesai tahun ajaran.
    Class:
      type: object
      description: Satu rombel (kelas) pada tahun ajaran tertentu.
      required: [id, academicYearId, majorId, majorCode, groupId, grade, section, name, slug, enrollmentCount]
      properties:
        id:
          type: string
          format: uuid
          description: ID kelas.
        academicYearId:
          type: string
          format: uuid
          description: ID tahun ajaran kelas ini.
        majorId:
          type: string
          format: uuid
          description: ID jurusan kelas ini.
        majorCode:
          type: string
          description: Kode jurusan kelas ini.
        groupId:
          type: string
          format: uuid
          description: ID grup yang mencerminkan kelas ini.
        grade:
          type: integer
          description: Tingkat kelas (10, 11, atau 12).
        section:
          type: string
          description: Rombel, misalnya "A".
        name:
          type: string
          description: Nama tampilan kelas, misalnya "XI RPL B".
        slug:
          type: string
          description: Slug kelas, misalnya "xi-rpl-b".
        enrollmentCount:
          type: integer
          format: int64
          description: Jumlah siswa yang terdaftar di kelas ini.
    ClassList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Class"
    ClassCreate:
      type: object
      required: [academicYearId, majorId, grade, section]
      properties:
        academicYearId:
          type: string
          format: uuid
          description: ID tahun ajaran kelas ini.
        majorId:
          type: string
          format: uuid
          description: ID jurusan kelas ini.
        grade:
          type: integer
          enum: [10, 11, 12]
          description: Tingkat kelas (10, 11, atau 12).
        section:
          type: string
          description: Rombel, 1–2 huruf kapital.
    ClassUpdate:
      type: object
      required: [section]
      properties:
        section:
          type: string
          description: Rombel baru, 1–2 huruf kapital.
    AdminClassRef:
      type: object
      description: Kelas terkini pengguna beserta jurusan dan tahun ajarannya.
      required: [id, name, majorCode, academicYearLabel]
      properties:
        id:
          type: string
          format: uuid
          description: ID kelas.
        name:
          type: string
          description: Nama tampilan kelas, misalnya "XI RPL B".
        majorCode:
          type: string
          description: Kode jurusan kelas.
        academicYearLabel:
          type: string
          description: Label tahun ajaran, misalnya "2026/2027".
    AdminPermission:
      type: object
      description: Satu entri katalog izin.
      required: [key, description, scopable]
      properties:
        key:
          type: string
          description: Kunci izin, misalnya "content.moderate".
        description:
          type: string
          description: Penjelasan singkat izin.
        scopable:
          type: boolean
          description: Apakah izin dapat dibatasi per jurusan.
    AdminPermissionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminPermission"
    AdminRole:
      type: object
      description: Definisi role beserta izin dan jumlah pemilik aktifnya.
      required: [id, slug, name, description, isSystem, permissions, holderCount]
      properties:
        id:
          type: string
          format: uuid
          description: ID role.
        slug:
          type: string
          description: Slug role, misalnya "major_admin".
        name:
          type: string
          description: Nama tampilan role.
        description:
          type: string
          nullable: true
          description: Deskripsi role.
        isSystem:
          type: boolean
          description: Apakah role bawaan sistem yang tidak dapat dihapus.
        permissions:
          type: array
          description: Kunci izin yang dimiliki role.
          items:
            type: string
        holderCount:
          type: integer
          format: int64
          description: Jumlah penugasan aktif role ini.
    AdminRoleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminRole"
    AdminRoleCreate:
      type: object
      description: Data pembuatan role kustom.
      required: [slug, name, permissions]
      properties:
        slug:
          type: string
          description: Slug unik, 2–50 karakter huruf kecil, angka, atau garis bawah.
        name:
          type: string
          description: Nama tampilan, 2–60 karakter.
        description:
          type: string
          description: Deskripsi role.
        permissions:
          type: array
          description: Kunci izin dari katalog.
          items:
            type: string
    AdminRoleUpdate:
      type: object
      description: Perubahan role. Field yang tidak dikirim tidak berubah.
      properties:
        name:
          type: string
          description: Nama tampilan, 2–60 karakter.
        description:
          type: string
          nullable: true
          description: Deskripsi role. Kirim string kosong untuk mengosongkan.
    AdminRolePermissionsUpdate:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          description: Himpunan izin baru, menggantikan seluruh izin role.
          items:
            type: string
    AdminRoleAssign:
      type: object
      required: [roleSlug]
      properties:
        roleSlug:
          type: string
          description: Slug role yang diberikan, misalnya "moderator".
        majorId:
          type: string
          format: uuid
          nullable: true
          description: Jurusan cakupan role. Kosong berarti global.
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Waktu kedaluwarsa penugasan. Harus di masa depan.
    AdminRoleAssignment:
      type: object
      description: Satu penugasan role aktif pengguna.
      required: [id, roleSlug, roleName, majorId, expiresAt]
      properties:
        id:
          type: string
          format: uuid
          description: ID penugasan role.
        roleSlug:
          type: string
          description: Slug role, misalnya "major_admin".
        roleName:
          type: string
          description: Nama tampilan role.
        majorId:
          type: string
          format: uuid
          nullable: true
          description: Jurusan cakupan role. Kosong berarti global.
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Waktu kedaluwarsa penugasan.
        assignedAt:
          type: string
          format: date-time
          description: Waktu penugasan dibuat.
    AdminRoleAssignmentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminRoleAssignment"
    AdminEnrollment:
      type: object
      description: Satu riwayat kelas pengguna.
      required: [classId, className, majorCode, academicYearLabel, outcome]
      properties:
        classId:
          type: string
          format: uuid
          description: ID kelas.
        className:
          type: string
          description: Nama tampilan kelas.
        majorCode:
