openapi: 3.0.3
info:
  title: Grafikarsa API
  version: 0.1.0
  description: |
    Kontrak API Grafikarsa. Berkas ini adalah sumber kebenaran (source of truth)
    untuk seluruh endpoint, skema permintaan, dan skema respons. Kode server Go
    dan klien TypeScript di-generate dari spesifikasi ini.
servers:
  - url: /api/v1
paths:
  /ping:
    get:
      operationId: getPing
      tags:
        - system
      summary: Cek API hidup
      responses:
        "200":
          description: API hidup dan siap menerima permintaan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pong"
        default:
          $ref: "#/components/responses/Problem"
  /auth/csrf:
    get:
      operationId: getAuthCsrf
      tags: [auth]
      summary: Ambil token CSRF
      description: |
        Mengatur cookie `__Host-gk_csrf` dan mengembalikan nilainya. Klien wajib
        mengirim nilai ini di header `X-CSRF-Token` untuk setiap request yang mengubah data.
      responses:
        "200":
          description: Token CSRF.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfToken"
        default:
          $ref: "#/components/responses/Problem"
  /auth/login:
    post:
      operationId: postAuthLogin
      tags: [auth]
      summary: Masuk dengan NISN/NIP/username dan sandi
      description: |
        Berhasil → cookie sesi `__Host-gk_session` diatur dan cookie CSRF diputar.
        `nextStep` memberi tahu klien halaman wajib berikutnya.
        Gagal → 401 `INVALID_CREDENTIALS` (pesan sama untuk identitas tidak ada dan sandi salah).
        Terlalu banyak percobaan → 429 `RATE_LIMITED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Berhasil masuk.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"
  /auth/logout:
    post:
      operationId: postAuthLogout
      tags: [auth]
      summary: Keluar (cabut sesi ini)
      responses:
        "204":
          description: Sesi dicabut dan cookie dihapus.
        default:
          $ref: "#/components/responses/Problem"
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Sesi saat ini
      description: Mengembalikan sesi aktif. Tanpa sesi → 401 `UNAUTHENTICATED`.
      responses:
        "200":
          description: Sesi aktif.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"
  /auth/username-availability:
    get:
      operationId: getAuthUsernameAvailability
      tags: [auth]
      summary: Cek ketersediaan username
      description: Butuh sesi (boleh belum aktivasi).
      parameters:
        - name: u
          in: query
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: Hasil pengecekan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsernameAvailability"
        default:
          $ref: "#/components/responses/Problem"
  /auth/activate:
    post:
      operationId: postAuthActivate
      tags: [auth]
      summary: Aktivasi akun (login pertama)
      description: |
        Hanya untuk sesi dengan `nextStep = activate`. Mengatur username dan sandi baru,
        lalu mengembalikan recovery code (hanya ditampilkan sekali). Aktivasi baru selesai
        setelah `POST /auth/recovery-codes/confirm`.
        Akun hasil migrasi v1 yang sudah punya username dan sandi boleh mengirim
        `newPassword` kosong untuk mempertahankan sandinya.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateRequest"
      responses:
        "200":
          description: Recovery code baru.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        default:
          $ref: "#/components/responses/Problem"
  /auth/recovery-codes/confirm:
    post:
      operationId: postAuthRecoveryCodesConfirm
      tags: [auth]
      summary: Konfirmasi recovery code sudah disimpan
      responses:
        "200":
          description: Aktivasi selesai, sesi diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"
  /auth/recovery-codes/regenerate:
    post:
      operationId: postAuthRecoveryCodesRegenerate
      tags: [auth]
      summary: Buat ulang recovery code
      description: Butuh sandi saat ini. Semua kode lama hangus.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirmation"
      responses:
        "200":
          description: Recovery code baru.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        default:
          $ref: "#/components/responses/Problem"
  /auth/password/recover:
    post:
      operationId: postAuthPasswordRecover
      tags: [auth]
      summary: Reset sandi dengan recovery code
      description: Tanpa sesi. Berhasil → semua sesi user dicabut, user harus masuk ulang.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoverPasswordRequest"
      responses:
        "204":
          description: Sandi diganti.
        default:
          $ref: "#/components/responses/Problem"
  /auth/password/change:
    post:
      operationId: postAuthPasswordChange
      tags: [auth]
      summary: Ganti sandi
      description: |
        `currentPassword` wajib kecuali sesi sedang `nextStep = change_password`
        (login dengan sandi sementara). Berhasil → sesi lain dicabut.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Sandi diganti, sesi saat ini diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"
  /auth/sessions:
    get:
      operationId: getAuthSessions
      tags: [auth]
      summary: Daftar sesi aktif milik user
      responses:
        "200":
          description: Sesi aktif.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDeviceList"
        default:
          $ref: "#/components/responses/Problem"
  /auth/sessions/{id}:
    delete:
      operationId: deleteAuthSession
      tags: [auth]
      summary: Cabut satu sesi milik user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Sesi dicabut.
        default:
          $ref: "#/components/responses/Problem"
  /auth/sessions/revoke-others:
    post:
      operationId: postAuthSessionsRevokeOthers
      tags: [auth]
      summary: Keluar dari semua perangkat lain
      responses:
        "204":
          description: Sesi lain dicabut.
        default:
          $ref: "#/components/responses/Problem"
  /majors:
    get:
      operationId: getMajors
      tags: [academic]
      summary: Daftar jurusan aktif
      description: Publik. Hanya mengembalikan jurusan yang aktif beserta grup cerminnya.
      responses:
        "200":
          description: Daftar jurusan aktif.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MajorList"
        default:
          $ref: "#/components/responses/Problem"
  /admin/majors:
    get:
      operationId: getAdminMajors
      tags: [admin-academic]
      summary: Daftar seluruh jurusan
      description: |
        Butuh izin `academic.manage_majors`, `academic.manage_years`,
        `academic.manage_classes`, atau `user.view`. Tanpa izin → 404.
        Termasuk jurusan yang sudah tidak aktif.
      responses:
        "200":
          description: Daftar seluruh jurusan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MajorList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: postAdminMajor
      tags: [admin-academic]
      summary: Buat jurusan
      description: |
        Membuat jurusan sekaligus grup cerminnya. Butuh izin `academic.manage_majors`.
        Tanpa izin → 404. Kode jurusan duplikat → 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MajorCreate"
      responses:
        "201":
          description: Jurusan dibuat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Major"
        default:
          $ref: "#/components/responses/Problem"
  /admin/majors/{id}:
    patch:
      operationId: patchAdminMajor
      tags: [admin-academic]
      summary: Ubah jurusan
      description: |
        Butuh izin `academic.manage_majors`. Tanpa izin → 404.
        Menonaktifkan jurusan memindahkan grupnya ke riwayat.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MajorUpdate"
      responses:
        "200":
          description: Jurusan diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Major"
        default:
          $ref: "#/components/responses/Problem"
  /admin/academic-years:
    get:
      operationId: getAdminAcademicYears
      tags: [admin-academic]
      summary: Daftar tahun ajaran
      description: |
        Butuh izin `academic.manage_majors`, `academic.manage_years`,
        `academic.manage_classes`, atau `user.view`. Tanpa izin → 404.
      responses:
        "200":
          description: Daftar tahun ajaran, terbaru lebih dulu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicYearList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: postAdminAcademicYear
      tags: [admin-academic]
      summary: Buat tahun ajaran
      description: |
        Butuh izin `academic.manage_years`. Tanpa izin → 404.
        Tahun ajaran duplikat → 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcademicYearCreate"
      responses:
        "201":
          description: Tahun ajaran dibuat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicYear"
        default:
          $ref: "#/components/responses/Problem"
  /admin/academic-years/{id}:
    patch:
      operationId: patchAdminAcademicYear
      tags: [admin-academic]
      summary: Ubah tanggal tahun ajaran
      description: |
        Butuh izin `academic.manage_years`. Tanpa izin → 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcademicYearUpdate"
      responses:
        "200":
          description: Tahun ajaran diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicYear"
        default:
          $ref: "#/components/responses/Problem"
  /admin/academic-years/{id}/set-current:
    post:
      operationId: postAdminAcademicYearSetCurrent
      tags: [admin-academic]
      summary: Tandai tahun ajaran sebagai tahun ajaran aktif
      description: |
        Butuh izin `academic.manage_years`. Tanpa izin → 404.
        Hanya satu tahun ajaran yang aktif dalam satu waktu.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Tahun ajaran aktif diperbarui.
        default:
          $ref: "#/components/responses/Problem"
  /admin/classes:
    get:
      operationId: getAdminClasses
      tags: [admin-academic]
      summary: Daftar kelas
      description: |
        Butuh izin `academic.manage_majors`, `academic.manage_years`,
        `academic.manage_classes`, atau `user.view`. Tanpa izin → 404.
      parameters:
        - name: academicYearId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: majorId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Daftar kelas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: postAdminClass
      tags: [admin-academic]
      summary: Buat kelas
      description: |
        Membuat kelas sekaligus grup cerminnya. Butuh izin `academic.manage_classes`
        pada jurusan terkait. Tanpa izin → 404. Kelas duplikat → 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassCreate"
      responses:
        "201":
          description: Kelas dibuat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
        default:
          $ref: "#/components/responses/Problem"
  /admin/classes/{id}:
    patch:
      operationId: patchAdminClass
      tags: [admin-academic]
      summary: Ubah rombel kelas
      description: |
        Butuh izin `academic.manage_classes` pada jurusan kelas terkait.
        Tanpa izin → 404. Kelas duplikat → 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassUpdate"
      responses:
        "200":
          description: Kelas diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteAdminClass
      tags: [admin-academic]
      summary: Hapus kelas
      description: |
        Butuh izin `academic.manage_classes` pada jurusan kelas terkait.
        Tanpa izin → 404. Kelas yang sudah punya siswa → 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Kelas dihapus.
        default:
          $ref: "#/components/responses/Problem"
components:
  schemas:
    CsrfToken:
      type: object
      required: [csrfToken]
      properties:
        csrfToken:
          type: string
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: NISN, NIP/ID staf, atau username.
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 128
    AccountType:
      type: string
      enum: [student, teacher, staff]
    AccountStatus:
      type: string
      enum: [active, alumni, transferred, inactive]
    NextStep:
      type: string
      description: |
        Halaman wajib berikutnya. `activate` → /aktivasi, `change_password` → /ganti-sandi,
        `none` → bebas. Selama bukan `none`, endpoint lain menolak dengan 403
        `ACTIVATION_REQUIRED` / `PASSWORD_CHANGE_REQUIRED`.
      enum: [activate, change_password, none]
    SessionUser:
      type: object
      required: [id, displayName, accountType, status]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          nullable: true
          description: Kosong sebelum aktivasi.
        displayName:
          type: string
        accountType:
          $ref: "#/components/schemas/AccountType"
        status:
          $ref: "#/components/schemas/AccountStatus"
        avatarUrl:
          type: string
          nullable: true
    RoleGrant:
      type: object
      description: Izin efektif user. `majorIds` kosong berarti scope global.
      required: [permission, global, majorIds]
      properties:
        permission:
          type: string
          example: content.moderate
        global:
          type: boolean
        majorIds:
          type: array
          items:
            type: string
            format: uuid
    Session:
      type: object
      required: [user, nextStep, grants, expiresAt]
      properties:
        user:
          $ref: "#/components/schemas/SessionUser"
        nextStep:
          $ref: "#/components/schemas/NextStep"
        grants:
          type: array
          items:
            $ref: "#/components/schemas/RoleGrant"
        isMigratedAccount:
          type: boolean
          description: Akun hasil migrasi v1 (aktivasi versi singkat).
        expiresAt:
          type: string
          format: date-time
    UsernameAvailability:
      type: object
      required: [username, available]
      properties:
        username:
          type: string
          description: Username yang sudah dinormalisasi (huruf kecil, tanpa spasi).
        available:
          type: boolean
        reason:
          type: string
          enum: [invalid_format, reserved, taken]
    ActivateRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
        newPassword:
          type: string
          maxLength: 128
    RecoveryCodes:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          description: Format `xxxxx-xxxxx`. Hanya ditampilkan sekali.
          items:
            type: string
    PasswordConfirmation:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 128
    RecoverPasswordRequest:
      type: object
      required: [identifier, recoveryCode, newPassword]
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 64
        recoveryCode:
          type: string
          minLength: 10
          maxLength: 20
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
    ChangePasswordRequest:
      type: object
      required: [newPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 128
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
    SessionDevice:
      type: object
      required: [id, current, createdAt, lastSeenAt]
      properties:
        id:
          type: string
          format: uuid
        current:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        userAgent:
          type: string
          nullable: true
        ipPrefix:
          type: string
          nullable: true
          description: IP yang disamarkan (mis. 103.134.78.x).
    SessionDeviceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionDevice"
    Major:
      type: object
      description: Data jurusan beserta grup cerminnya.
      required: [id, code, name, shortName, isActive, sortOrder, groupId]
      properties:
        id:
          type: string
          format: uuid
          description: ID jurusan.
        code:
          type: string
          description: Kode unik jurusan (huruf kecil).
        name:
          type: string
          description: Nama lengkap jurusan.
        shortName:
          type: string
          description: Nama singkat jurusan untuk nama kelas.
        isActive:
          type: boolean
          description: Apakah jurusan masih aktif.
        sortOrder:
          type: integer
          description: Urutan tampil jurusan.
        groupId:
          type: string
          format: uuid
          description: ID grup yang mencerminkan jurusan ini.
    MajorList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Major"
    MajorCreate:
      type: object
      required: [code, name, shortName]
      properties:
        code:
          type: string
          description: Kode jurusan, huruf kecil tanpa spasi.
        name:
          type: string
          description: Nama lengkap jurusan.
        shortName:
          type: string
          description: Nama singkat jurusan (huruf kapital).
        sortOrder:
          type: integer
          description: Urutan tampil jurusan. Default 0.
    MajorUpdate:
      type: object
      properties:
        name:
          type: string
          description: Nama lengkap jurusan.
        shortName:
          type: string
          description: Nama singkat jurusan (huruf kapital).
        sortOrder:
          type: integer
          description: Urutan tampil jurusan.
        isActive:
          type: boolean
          description: Aktif atau nonaktif.
    AcademicYear:
      type: object
      description: Satu tahun ajaran.
      required: [id, startYear, label, slug, startsOn, endsOn, isCurrent]
      properties:
        id:
          type: string
          format: uuid
          description: ID tahun ajaran.
        startYear:
          type: integer
          description: Tahun mulai, misalnya 2026.
        label:
          type: string
          description: Label tahun ajaran, misalnya "2026/2027".
        slug:
          type: string
          description: Slug tahun ajaran, misalnya "2026-2027".
        startsOn:
          type: string
          format: date
          description: Tanggal mulai tahun ajaran.
        endsOn:
          type: string
          format: date
          description: Tanggal selesai tahun ajaran.
        isCurrent:
          type: boolean
          description: Apakah ini tahun ajaran yang aktif saat ini.
    AcademicYearList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AcademicYear"
    AcademicYearCreate:
      type: object
      required: [startYear, startsOn, endsOn]
      properties:
        startYear:
          type: integer
          description: Tahun mulai, misalnya 2026.
        startsOn:
          type: string
          format: date
          description: Tanggal mulai tahun ajaran.
        endsOn:
          type: string
          format: date
          description: Tanggal selesai tahun ajaran.
    AcademicYearUpdate:
      type: object
      properties:
        startsOn:
          type: string
          format: date
          description: Tanggal mulai tahun ajaran.
        endsOn:
          type: string
          format: date
          description: Tanggal selesai tahun ajaran.
    Class:
      type: object
      description: Satu rombel (kelas) pada tahun ajaran tertentu.
      required: [id, academicYearId, majorId, majorCode, groupId, grade, section, name, slug, enrollmentCount]
      properties:
        id:
          type: string
          format: uuid
          description: ID kelas.
        academicYearId:
          type: string
          format: uuid
          description: ID tahun ajaran kelas ini.
        majorId:
          type: string
          format: uuid
          description: ID jurusan kelas ini.
        majorCode:
          type: string
          description: Kode jurusan kelas ini.
        groupId:
          type: string
          format: uuid
          description: ID grup yang mencerminkan kelas ini.
        grade:
          type: integer
          description: Tingkat kelas (10, 11, atau 12).
        section:
          type: string
          description: Rombel, misalnya "A".
        name:
          type: string
          description: Nama tampilan kelas, misalnya "XI RPL B".
        slug:
          type: string
          description: Slug kelas, misalnya "xi-rpl-b".
        enrollmentCount:
          type: integer
          format: int64
          description: Jumlah siswa yang terdaftar di kelas ini.
