# ==============================================
# GRAFIKARSA MONOREPO - SERVER DEPLOYMENT
# ==============================================
# This file is used on the production server.
# Images are pulled from Docker Hub (pushed by CI/CD).
#
# Usage: docker compose -f docker-compose.deploy.yml up -d

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: grafikarsa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - grafikarsa-network

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: grafikarsa-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - grafikarsa-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: grafikarsa-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - grafikarsa-network

  # Go Backend API (from Docker Hub)
  backend:
    image: ${DOCKERHUB_USERNAME}/grafikarsa-backend:${IMAGE_TAG:-latest}
    container_name: grafikarsa-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - APP_ENV=production
      - DB_HOST=db
      - MINIO_ENDPOINT=minio:9000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GOOGLE_GEMINI_API_KEY=${GOOGLE_GEMINI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - grafikarsa-network

  # Next.js Frontend (from Docker Hub)
  web:
    image: ${DOCKERHUB_USERNAME}/grafikarsa-web:${IMAGE_TAG:-latest}
    container_name: grafikarsa-web
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - NEXT_PUBLIC_AI_FEATURES_ENABLED=${NEXT_PUBLIC_AI_FEATURES_ENABLED}
    depends_on:
      - backend
    networks:
      - grafikarsa-network

volumes:
  postgres_data:
  minio_data:
  redis_data:

networks:
  grafikarsa-network:
    driver: bridge
