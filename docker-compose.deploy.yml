# ==============================================
# GRAFIKARSA v2 — SERVER DEPLOYMENT (single-domain)
# ==============================================
# Setup awal server baru:
#   1. Copy file ini + Caddyfile + tools/server-init.sh ke /opt/grafikarsa
#   2. ./tools/server-init.sh  (generate secret + validasi DOMAIN)
#   3. docker compose -f docker-compose.deploy.yml up -d
#
# Arsitektur:
#   internet --80/443--> proxy (Caddy, auto HTTPS)
#     / -> web:3000 (Next SSR + BFF /api/*, satu-satunya upstream publik)
#
# HANYA proxy yang punya port host. api/db/dragonfly/storage
# komunikasi via network internal. Browser tidak pernah kontak
# backend/storage langsung.
#
# Usage: docker compose -f docker-compose.deploy.yml up -d

services:
  # Reverse proxy — SATU-SATUNYA service dengan port host.
  proxy:
    image: caddy:2-alpine
    container_name: grafikarsa-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 (opsional, diabaikan jika diblokir firewall)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN}
    depends_on:
      - web
    networks:
      - grafikarsa-network

  db:
    image: postgres:16-alpine
    container_name: grafikarsa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - grafikarsa-network

  dragonfly:
    image: ghcr.io/dragonflydb/dragonfly:latest
    container_name: grafikarsa-dragonfly
    restart: unless-stopped
    # snapshot_cron: simpan snapshot cache tiap 5 menit. Tanpa ini snapshot
    # hanya terjadi saat shutdown, jadi crash = semua counter rate-limit,
    # blacklist JTI, dan agregat view counter hilang sekaligus.
    #
    # PENTING: nilai cron harus tetap SATU argumen. Bentuk string (>) memecah
    # "--snapshot_cron=*/5 * * * *" menjadi beberapa argv, sehingga flag-nya
    # hanya menerima "*/5" dan dragonfly menolak start:
    #   ERROR: Illegal value '*/5' specified for flag 'snapshot_cron'
    # Kalau dragonfly gagal start, `api` (depends_on: service_healthy) tidak
    # akan pernah start juga.
    #
    # Formatnya crontab 5 field (menit jam hari bulan hari-dalam-minggu).
    # Catatan: pesan error dragonfly menyebut "six fields", padahal 6 field
    # justru yang DITOLAK — sudah diuji langsung ke binary-nya.
    command:
      - --maxmemory=256mb
      - --proactor_threads=1
      - --cache_mode
      - --dir=/data
      - --dbfilename=dump
      - "--snapshot_cron=*/5 * * * *"
    volumes:
      - dragonfly_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - grafikarsa-network

  # Default: RustFS self-host. Ganti vendor = ganti image + S3_* env.
  storage:
    image: rustfs/rustfs:latest
    container_name: grafikarsa-storage
    restart: unless-stopped
    environment:
      # Vendor container membaca RUSTFS_*; aplikasi (api/worker) TIDAK pernah
      # membaca RUSTFS_*, hanya S3_* sehingga ganti vendor = ganti service ini.
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - storage_data:/data
    command: ["/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - grafikarsa-network

  api:
    image: ${DOCKERHUB_USERNAME}/grafikarsa-api:${IMAGE_TAG:-latest}
    container_name: grafikarsa-api
    restart: unless-stopped
    env_file: .env
    environment:
      - APP_ENV=production
      - DB_HOST=db
      - DRAGONFLY_HOST=dragonfly
      - S3_ENDPOINT=http://storage:9000
      # Backup manual (permission system.backup) menulis ke volume persisten.
      - BACKUP_DIR=/var/backups/grafikarsa
    volumes:
      - backup_data:/var/backups/grafikarsa
    depends_on:
      db:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      storage:
        condition: service_healthy
    # WAJIB ada: service `web` bergantung pada api dengan
    # condition: service_healthy. Tanpa healthcheck di sini, compose menolak
    # start web:
    #   dependency failed to start: container grafikarsa-api has no healthcheck
    #   configured
    # …lalu proxy (yang bergantung pada web) juga ikut tidak start.
    healthcheck:
      test: ["CMD", "/api", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - grafikarsa-network

  worker:
    image: ${DOCKERHUB_USERNAME}/grafikarsa-api:${IMAGE_TAG:-latest}
    container_name: grafikarsa-worker
    restart: unless-stopped
    entrypoint: ["/worker"]
    command: ["serve"]
    env_file: .env
    environment:
      - APP_ENV=production
      - DB_HOST=db
      - DRAGONFLY_HOST=dragonfly
      - S3_ENDPOINT=http://storage:9000
    depends_on:
      db:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/worker", "-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - grafikarsa-network

  web:
    image: ${DOCKERHUB_USERNAME}/grafikarsa-web:${IMAGE_TAG:-latest}
    container_name: grafikarsa-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # SSR di dalam Docker harus pakai hostname internal (mencegah EAI_AGAIN).
      - INTERNAL_API_URL=http://api:8080/v1
      # Dipakai BFF untuk origin check mutasi.
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      # Next.js standalone memakai env HOSTNAME sebagai alamat bind. Di Docker,
      # HOSTNAME otomatis berisi id container, jadi server hanya listen di IP
      # container itu saja — healthcheck "localhost:3000" selalu connection
      # refused dan container ditandai unhealthy, padahal trafik lewat nama
      # service (web:3000) lancar. Dengan 0.0.0.0, keduanya bekerja.
      - HOSTNAME=0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Pakai 127.0.0.1, bukan "localhost": di container, "localhost" bisa
      # resolve ke ::1 (IPv6) lebih dulu, sedangkan Next.js listen di IPv4 —
      # healthcheck jadi connection refused padahal servenya jalan.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - grafikarsa-network

volumes:
  # Nama volume ditulis EKSPLISIT, bukan mengandalkan nama project compose.
  #
  # Alasannya: stack v1 masih ada di server dan project name-nya juga
  # "grafikarsa". Tanpa nama eksplisit, key `postgres_data` di compose v2
  # akan resolve ke volume yang SAMA dengan v1 — `grafikarsa_postgres_data`,
  # yang dibuat oleh postgres:15. Image v2 memakai postgres:16, dan
  # postgres:16 MELEGAL start di data dir postgres:15 ("database files are
  # incompatible with server"). Jadi bukan cuma "datanya kebaca", tapi
  # container db-nya gagal start sama sekali.
  #
  # Volume v1 tetap utuh di disk setelah go-live (jaring pengaman untuk
  # rollback), tapi tidak pernah disentuh stack v2.
  backup_data:
    name: grafikarsa_v2_backup_data
  postgres_data:
    name: grafikarsa_v2_postgres_data
  dragonfly_data:
    name: grafikarsa_v2_dragonfly_data
  storage_data:
    name: grafikarsa_v2_storage_data
  # Caddy sengaja DIPAKAI BERSAMA dengan v1: volume ini menyimpan
  # sertifikat TLS, jadi pergantian stack tidak perlu menerbitkan ulang
  # sertifikat (dan tidak ada jendela di mana HTTPS gagal).
  caddy_data:
    name: grafikarsa_caddy_data
  caddy_config:
    name: grafikarsa_caddy_config

networks:
  grafikarsa-network:
    driver: bridge
